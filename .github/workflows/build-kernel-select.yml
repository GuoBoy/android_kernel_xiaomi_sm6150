name: Violet Droidspaces KernelSU-Next

on:
  push:
    branches:
      - lineage-23.2

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Redmi Note 7 Pro Violet Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: vendor/sdmsteppe-perf_defconfig
      OUT: ${{ github.workspace }}/out

      BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
      DTBO_URL: https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img
      RECOVERY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img
      SUPER_EMPTY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img
      VBMETA_URL: https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img
      MANIFEST_URL: https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml

    steps:

      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # CLANG
      # ============================================================

      - name: Setup Android Clang
        run: |
          mkdir -p "$RUNNER_TEMP/clang"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/clang"

          test -x \
            "$RUNNER_TEMP/clang/clang-r383902/bin/clang"

          echo \
            "$RUNNER_TEMP/clang/clang-r383902/bin" \
            >> "$GITHUB_PATH"

          clang --version

      # ============================================================
      # CROSS COMPILER
      # ============================================================

      - name: Setup cross compiler
        run: |
          mkdir -p "$RUNNER_TEMP/cross"

          ln -sf \
            "$(command -v aarch64-linux-gnu-ld)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-ld"

          ln -sf \
            "$(command -v aarch64-linux-gnu-as)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-as"

          ln -sf \
            "$(command -v aarch64-linux-gnu-objcopy)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-objcopy"

          ln -sf \
            "$(command -v aarch64-linux-gnu-objdump)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-objdump"

          ln -sf \
            "$(command -v aarch64-linux-gnu-nm)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-nm"

          ln -sf \
            "$(command -v aarch64-linux-gnu-strip)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-strip"

          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Configure toolchain
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo \
            "CROSS_COMPILE=$RUNNER_TEMP/cross/aarch64-linux-androidkernel-" \
            >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"

          # Linux 4.14:
          # disable LLVM integrated assembler
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"

      # ============================================================
      # KERNELSU-NEXT
      #
      # IMPORTANT:
      # Run official setup.sh from kernel source root.
      # Use legacy explicitly.
      # ============================================================

      - name: Add KernelSU-Next Legacy
        run: |
          cd "$GITHUB_WORKSPACE"

          test -d drivers
          test -f Makefile
          test -f Kconfig

          echo "========================================"
          echo " Installing KernelSU-Next LEGACY"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo
          echo "========================================"
          echo " KernelSU-Next installation result"
          echo "========================================"

          test -d "$GITHUB_WORKSPACE/KernelSU-Next"

          test -L \
            "$GITHUB_WORKSPACE/drivers/kernelsu"

          echo
          echo "KernelSU-Next:"
          ls -lah "$GITHUB_WORKSPACE/KernelSU-Next"

          echo
          echo "drivers/kernelsu:"
          ls -lah "$GITHUB_WORKSPACE/drivers/kernelsu"

          echo
          echo "KernelSU Kconfig:"
          grep -n "KSU" \
            "$GITHUB_WORKSPACE/drivers/kernelsu/Kconfig" \
            | head -20 || true

      # ============================================================
      # VERIFY KERNELSU SOURCE
      # ============================================================

      - name: Verify KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " KernelSU-Next"
          echo "========================================"

          test -d KernelSU-Next
          test -L drivers/kernelsu

          echo
          echo "KernelSU-Next commit:"

          git -C KernelSU-Next rev-parse --short HEAD

          echo
          echo "KernelSU-Next tag/branch:"

          git -C KernelSU-Next describe --tags --always || true

          echo
          echo "drivers/kernelsu ->"

          readlink -f drivers/kernelsu

          echo
          echo "========================================"
          echo " KernelSU source check PASSED"
          echo "========================================"

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Generate defconfig
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf "$OUT"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ============================================================
      # KERNELSU CONFIG
      #
      # Non-GKI 4.14:
      # kprobe based hooks are recommended by KernelSU-Next.
      # ============================================================

      - name: Enable KernelSU configuration
        run: |
          cd "$GITHUB_WORKSPACE"

          ./scripts/config \
            --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU_KPROBE_HOOKS \
            --enable KSU

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

          echo
          echo "========== KernelSU config =========="

          grep -E \
            '^CONFIG_(KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|KSU)=' \
            "$OUT/.config"

      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Configure Droidspaces
        run: |
          cd "$GITHUB_WORKSPACE"

          ./scripts/config \
            --file "$OUT/.config" \
            \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            \
            --enable DEVTMPFS \
            \
            --enable OVERLAY_FS \
            \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable FW_LOADER_COMPRESS \
            \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT_REDIRECT \
            \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

      # ============================================================
      # VERIFY CONFIG
      #
      # This happens BEFORE the long kernel build.
      # ============================================================

      - name: Verify configuration
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          REQUIRED_KSU="
          KPROBES
          KPROBE_EVENTS
          KSU_KPROBE_HOOKS
          KSU
          "

          FAILED=0

          for CONFIG in $REQUIRED_KSU; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          FW_LOADER_COMPRESS
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_CONNTRACK_NETLINK
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          echo
          echo "========================================"
          echo " Result"
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Configuration check FAILED."
            exit 1
          fi

          echo "ALL CONFIGURATION CHECKS PASSED."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " BUILDING"
          echo "========================================"

          make -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            Image.gz \
            dtbs \
            modules

          test -f \
            "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "BUILD SUCCESS"

      # ============================================================
      # DOWNLOAD STOCK BOOT
      # ============================================================

      - name: Download stock boot
        run: |
          mkdir -p "$RUNNER_TEMP/stock"

          curl -fL \
            "$BOOT_URL" \
            -o "$RUNNER_TEMP/stock/boot.img"

          curl -fL \
            "$DTBO_URL" \
            -o "$RUNNER_TEMP/stock/dtbo.img"

          curl -fL \
            "$RECOVERY_URL" \
            -o "$RUNNER_TEMP/stock/recovery.img"

          curl -fL \
            "$SUPER_EMPTY_URL" \
            -o "$RUNNER_TEMP/stock/super_empty.img"

          curl -fL \
            "$VBMETA_URL" \
            -o "$RUNNER_TEMP/stock/vbmeta.img"

          curl -fL \
            "$MANIFEST_URL" \
            -o "$RUNNER_TEMP/stock/build-manifest.xml"

          ls -lh "$RUNNER_TEMP/stock"

      # ============================================================
      # MAGISKBOOT
      # ============================================================

      - name: Get magiskboot
        run: |
          mkdir -p "$RUNNER_TEMP/magisk"

          curl -fL \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
            -o "$RUNNER_TEMP/magisk/Magisk.apk"

          unzip -j \
            "$RUNNER_TEMP/magisk/Magisk.apk" \
            'lib/x86_64/libmagiskboot.so' \
            -d "$RUNNER_TEMP/magisk"

          mv \
            "$RUNNER_TEMP/magisk/libmagiskboot.so" \
            "$RUNNER_TEMP/magisk/magiskboot"

          chmod +x \
            "$RUNNER_TEMP/magisk/magiskboot"

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack boot.img
        run: |
          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            "$RUNNER_TEMP/stock/boot.img" \
            "$RUNNER_TEMP/boot/stock-boot.img"

          cd "$RUNNER_TEMP/boot"

          echo "========== Unpack =========="

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack stock-boot.img

          test -f kernel

          echo
          echo "Original kernel:"
          file kernel
          ls -lh kernel

          echo
          echo "Compiled kernel:"
          file "$OUT/arch/arm64/boot/Image.gz"
          ls -lh "$OUT/arch/arm64/boot/Image.gz"

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            kernel

          echo
          echo "========== Repack =========="

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack \
            stock-boot.img \
            violet-droidspaces-kernelsu.img

          test -f \
            violet-droidspaces-kernelsu.img

          ls -lh \
            violet-droidspaces-kernelsu.img

      # ============================================================
      # RELEASE FILES
      # ============================================================

      - name: Prepare release
        run: |
          mkdir -p "$RUNNER_TEMP/release"

          cp \
            "$RUNNER_TEMP/boot/violet-droidspaces-kernelsu.img" \
            "$RUNNER_TEMP/release/violet-droidspaces-kernelsu.img"

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/release/Image.gz"

          cp \
            "$RUNNER_TEMP/stock/dtbo.img" \
            "$RUNNER_TEMP/release/dtbo-stock.img"

          cp \
            "$RUNNER_TEMP/stock/recovery.img" \
            "$RUNNER_TEMP/release/recovery-stock.img"

          cp \
            "$RUNNER_TEMP/stock/super_empty.img" \
            "$RUNNER_TEMP/release/super_empty-stock.img"

          cp \
            "$RUNNER_TEMP/stock/vbmeta.img" \
            "$RUNNER_TEMP/release/vbmeta-stock.img"

          cp \
            "$RUNNER_TEMP/stock/build-manifest.xml" \
            "$RUNNER_TEMP/release/build-manifest.xml"

          cp \
            "$OUT/.config" \
            "$RUNNER_TEMP/release/kernel.config"

          cat > \
            "$RUNNER_TEMP/release/build-info.txt" <<EOF
          Device: Xiaomi Redmi Note 7 Pro
          Codename: violet
          ROM: LineageOS 23.2
          ROM Build: 20260826
          Kernel: 4.14.357
          Defconfig: vendor/sdmsteppe-perf_defconfig
          KernelSU-Next: legacy
          Droidspaces: enabled
          SUSFS: disabled
          LLVM_IAS: 0
          EOF

          cd "$RUNNER_TEMP/release"

          sha256sum * > sha256sum.txt

          ls -lah

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-droidspaces-kernelsu
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "droidspaces-${{ github.run_number }}"
          name: "Redmi Note 7 Pro Droidspaces + KernelSU-Next ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true

          files: |
            ${{ runner.temp }}/release/violet-droidspaces-kernelsu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/dtbo-stock.img
            ${{ runner.temp }}/release/recovery-stock.img
            ${{ runner.temp }}/release/super_empty-stock.img
            ${{ runner.temp }}/release/vbmeta-stock.img
            ${{ runner.temp }}/release/build-manifest.xml
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt
