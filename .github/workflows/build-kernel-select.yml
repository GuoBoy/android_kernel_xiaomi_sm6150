name: Redmi Note 7 Pro KernelSU Droidspaces

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  CLANG_VERSION: "clang-r547379"
  CLANG_TAG: "android-16.0.0_r4"

  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: "legacy"

  AIK_REPO: "https://github.com/osm0sis/Android-Image-Kitchen.git"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel source
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. Install build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. Restore ccache
      # ============================================================

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: violet-ccache-${{ runner.os }}-${{ hashFiles('Makefile', 'Kconfig', 'Kconfig.*', 'arch/**/Makefile', 'arch/**/Kconfig*') }}
          restore-keys: |
            violet-ccache-${{ runner.os }}-

      # ============================================================
      # 4. Configure ccache
      # ============================================================

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$HOME/.ccache"

          ccache --max-size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Restore Android Clang cache
      #
      # Clang 是固定版本，因此非常适合缓存。
      # ============================================================

      - name: Restore Android Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: android-clang-${{ env.CLANG_VERSION }}-${{ env.CLANG_TAG }}-v2

      # ============================================================
      # 6. Download Android Clang
      #
      # 不再 clone 整个 googlesource 仓库。
      #
      # 直接下载固定 tag 下的 clang-r547379 archive。
      # ============================================================

      - name: Download Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/clang"

          mkdir -p "$RUNNER_TEMP/clang"

          cd "$RUNNER_TEMP"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${CLANG_TAG}/${CLANG_VERSION}.tar.gz"

          tar -xzf clang.tar.gz \
            -C "$RUNNER_TEMP/clang"

          rm -f clang.tar.gz

          test -x "$RUNNER_TEMP/clang/bin/clang"

          test -x "$RUNNER_TEMP/clang/bin/ld.lld"

      # ============================================================
      # 7. Verify Clang
      # ============================================================

      - name: Verify Android Clang
        run: |
          set -eux

          test -x "$RUNNER_TEMP/clang/bin/clang"
          test -x "$RUNNER_TEMP/clang/bin/ld.lld"

          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

          echo "CLANG_BIN=$RUNNER_TEMP/clang/bin" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo " Android Clang"
          echo "========================================"

          "$RUNNER_TEMP/clang/bin/clang" --version

          "$RUNNER_TEMP/clang/bin/ld.lld" --version

      # ============================================================
      # 8. Configure LLVM / GNU assembler
      # ============================================================

      - name: Configure toolchain
        run: |
          set -eux

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"

          # Linux 4.14:
          # use GNU assembler instead of LLVM integrated assembler.
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 9. Prepare output directory
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/out"

          mkdir -p "$GITHUB_WORKSPACE/out"

          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ============================================================
      # 10. KernelSU-Next
      #
      # 不调用 setup.sh。
      #
      # setup.sh 本身会重新 clone / pull / describe tag，
      # 这正是之前反复出现错误的来源。
      #
      # 这里直接 clone legacy branch，然后执行它实际需要的：
      #   drivers/kernelsu -> KernelSU-Next/kernel
      #   drivers/Makefile
      #   drivers/Kconfig
      # ============================================================

      - name: Integrate KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU-Next
          rm -f drivers/kernelsu

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig

          ln -s \
            "$(realpath --relative-to="$GITHUB_WORKSPACE/drivers" "$GITHUB_WORKSPACE/KernelSU-Next/kernel")" \
            "$GITHUB_WORKSPACE/drivers/kernelsu"

          grep -q "obj-\$(CONFIG_KSU) += kernelsu/" \
            "$GITHUB_WORKSPACE/drivers/Makefile" \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> "$GITHUB_WORKSPACE/drivers/Makefile"

          grep -q 'source "drivers/kernelsu/Kconfig"' \
            "$GITHUB_WORKSPACE/drivers/Kconfig" \
            || sed -i \
              '/endmenu/i source "drivers/kernelsu/Kconfig"' \
              "$GITHUB_WORKSPACE/drivers/Kconfig"

          echo
          echo "========================================"
          echo " KernelSU-Next"
          echo "========================================"

          git -C KernelSU-Next rev-parse HEAD

          test -L drivers/kernelsu

          readlink -f drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

      # ============================================================
      # 11. Load defconfig
      # ============================================================

      - name: Load kernel defconfig
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ============================================================
      # 12. Enable KernelSU + Droidspaces
      # ============================================================

      - name: Configure KernelSU and Droidspaces
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          # ========================================================
          # KernelSU
          # ========================================================

          ./scripts/config \
            --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU \
            --enable KSU_KPROBE_HOOKS

          # ========================================================
          # Droidspaces
          # ========================================================

          ./scripts/config \
            --file "$OUT/.config" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          # Droidspaces / Android legacy compatibility.
          ./scripts/config \
            --file "$OUT/.config" \
            --disable ANDROID_PARANOID_NETWORK

          # ========================================================
          # Let Kconfig resolve dependencies.
          # ========================================================

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            olddefconfig

          test -f "$OUT/.config"

      # ============================================================
      # 13. Verify final configuration
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          grep '^CONFIG_KPROBES=y' "$OUT/.config"
          grep '^CONFIG_KPROBE_EVENTS=y' "$OUT/.config"
          grep '^CONFIG_KSU=y' "$OUT/.config"
          grep '^CONFIG_KSU_KPROBE_HOOKS=y' "$OUT/.config"

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_CONNTRACK_NETLINK
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NETFILTER_XT_MATCH_CONNTRACK
          NETFILTER_XT_MATCH_MULTIPORT
          NETFILTER_XT_MATCH_RECENT
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required configuration is missing."
            exit 1
          fi

      # ============================================================
      # 14. Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="ccache clang"

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

          test -f "$OUT/arch/arm64/boot/Image.gz"

      # ============================================================
      # 15. Verify kernel output
      # ============================================================

      - name: Verify kernel output
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo " Kernel output"
          echo "========================================"

          ls -lh \
            "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "========================================"
          echo " Kernel version"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " ccache statistics"
          echo "========================================"

          ccache --show-stats

      # ============================================================
      # 16. Download matching ROM images
      # ============================================================

      - name: Download LineageOS images
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/images"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/boot.img" \
            "$BOOT_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/dtbo.img" \
            "$DTBO_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/recovery.img" \
            "$RECOVERY_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/super_empty.img" \
            "$SUPER_EMPTY_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/vbmeta.img" \
            "$VBMETA_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/build-manifest.xml" \
            "$MANIFEST_URL"

          ls -lh "$RUNNER_TEMP/images"

      # ============================================================
      # 17. Restore Android Image Kitchen cache
      # ============================================================

      - name: Restore Android Image Kitchen cache
        id: aik-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/AIK
          key: android-image-kitchen-v1

      # ============================================================
      # 18. Download Android Image Kitchen
      # ============================================================

      - name: Download Android Image Kitchen
        if: steps.aik-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/AIK"

          git clone \
            --depth=1 \
            "$AIK_REPO" \
            "$RUNNER_TEMP/AIK"

      # ============================================================
      # 19. Verify Android Image Kitchen
      # ============================================================

      - name: Verify Android Image Kitchen
        run: |
          set -eux

          test -f "$RUNNER_TEMP/AIK/unpackimg.sh"
          test -f "$RUNNER_TEMP/AIK/repackimg.sh"

          chmod +x \
            "$RUNNER_TEMP/AIK/unpackimg.sh" \
            "$RUNNER_TEMP/AIK/repackimg.sh"

          echo "AIK=$RUNNER_TEMP/AIK" >> "$GITHUB_ENV"

      # ============================================================
      # 20. Unpack original boot.img
      # ============================================================

      - name: Unpack boot image
        run: |
          set -eux

          cd "$AIK"

          rm -rf \
            split_img \
            ramdisk \
            boot.img \
            image-new.img

          cp \
            "$RUNNER_TEMP/images/boot.img" \
            boot.img

          ./unpackimg.sh \
            -i boot.img

          test -d split_img
          test -f split_img/boot.img-kernel

      # ============================================================
      # 21. Replace kernel
      # ============================================================

      - name: Replace kernel image
        run: |
          set -eux

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$AIK/split_img/boot.img-kernel"

          test -s \
            "$AIK/split_img/boot.img-kernel"

      # ============================================================
      # 22. Repack boot.img
      # ============================================================

      - name: Repack boot image
        run: |
          set -eux

          cd "$AIK"

          ./repackimg.sh

          test -s image-new.img

          cp \
            image-new.img \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

          test -s \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      # ============================================================
      # 23. Generate SHA256
      # ============================================================

      - name: Generate checksums
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            boot-kernelsu-droidspaces.img \
            > boot-kernelsu-droidspaces.img.sha256

          sha256sum \
            "$RUNNER_TEMP/images/dtbo.img" \
            "$RUNNER_TEMP/images/recovery.img" \
            "$RUNNER_TEMP/images/super_empty.img" \
            "$RUNNER_TEMP/images/vbmeta.img" \
            "$RUNNER_TEMP/images/build-manifest.xml" \
            > original-files.sha256

      # ============================================================
      # 24. Create release notes
      # ============================================================

      - name: Create release notes
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          KERNEL_VERSION="$(
            make \
              O="$OUT" \
              ARCH="$ARCH" \
              kernelversion
          )"

          KSU_COMMIT="$(
            git -C KernelSU-Next rev-parse --short HEAD
          )"

          cat > RELEASE.txt <<EOF
          Redmi Note 7 Pro (violet)

          ROM:
          LineageOS 23.2

          ROM build:
          ${ROM_BUILD}

          Kernel:
          ${KERNEL_VERSION}

          Architecture:
          arm64

          KernelSU:
          KernelSU-Next legacy

          KernelSU commit:
          ${KSU_COMMIT}

          Droidspaces:
          Enabled

          Build commit:
          ${GITHUB_SHA}

          Main file:
          boot-kernelsu-droidspaces.img

          Matching ROM:
          lineage-23.2-${ROM_BUILD}-nightly-violet

          KernelSU mode:
          KPROBE

          LLVM:
          ${CLANG_VERSION}

          LLVM_IAS:
          0
          EOF

          cat RELEASE.txt

      # ============================================================
      # 25. Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernelsu-droidspaces-${{ env.ROM_BUILD }}
          path: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
            RELEASE.txt
          retention-days: 30

      # ============================================================
      # 26. Create GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "violet-${{ env.ROM_BUILD }}-${{ github.sha }}"
          name: "Redmi Note 7 Pro KernelSU + Droidspaces ${{ env.ROM_BUILD }}"
          body_path: RELEASE.txt
          files: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
