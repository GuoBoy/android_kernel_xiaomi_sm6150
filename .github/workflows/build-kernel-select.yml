name: Build Violet Kernel with KernelSU v0.9.5 + Droidspaces

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - "**"

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  CLANG_VERSION: "clang-r547379"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libncurses5-dev libssl-dev lz4 \
            python3 rsync unzip wget xz-utils zip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: violet-kernel-ccache-${{ runner.os }}-${{ hashFiles('Makefile', 'Kconfig', 'arch/**', 'drivers/**', 'fs/**', 'include/**', 'kernel/**', 'mm/**', 'net/**') }}
          restore-keys: |
            violet-kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"
          ccache --max-size=5G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore/Download Android Clang
        uses: actions/cache@v4
        id: clang_cache
        with:
          path: ${{ runner.temp }}/clang
          key: android-clang-${{ env.CLANG_VERSION }}-ubuntu-22.04-v1

      - name: Download Clang if not cached
        if: steps.clang_cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/clang" "$RUNNER_TEMP/android-clang-source"
          mkdir -p "$RUNNER_TEMP/clang"
          cd "$RUNNER_TEMP"
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            android-clang-source
          cd android-clang-source
          git sparse-checkout set clang-r547379
          cp -a clang-r547379/. "$RUNNER_TEMP/clang/"
          cd "$RUNNER_TEMP"
          rm -rf android-clang-source

      - name: Check Clang and set PATH
        run: |
          CLANG_BIN="$RUNNER_TEMP/clang/bin"
          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"
          test -x "$CLANG_BIN/llvm-ar"
          test -x "$CLANG_BIN/llvm-nm"
          test -x "$CLANG_BIN/llvm-objcopy"
          test -x "$CLANG_BIN/llvm-objdump"
          test -x "$CLANG_BIN/llvm-readelf"
          test -x "$CLANG_BIN/llvm-size"
          test -x "$CLANG_BIN/llvm-strip"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "Android Clang:"
          "$CLANG_BIN/clang" --version

      - name: Setup LLVM environment
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: Prepare out directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ============================================================
      # 集成官方 KernelSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          if [ ! -e KernelSU ]; then
            ln -sf KernelSU-0.9.5 KernelSU
          fi

      # ============================================================
      # 修复设备树编译错误 (tpdm_west + sm6150-coresight)
      # ============================================================
      - name: Fix device tree compilation errors
        run: |
          cd "$GITHUB_WORKSPACE"
          # 1. 修复 tpdm_west 引用
          for file in arch/arm64/boot/dts/qcom/*.dtsi; do
            if [ -f "$file" ] && grep -q tpdm_west "$file"; then
              echo "Fixing $file for tpdm_west"
              sed -i 's/^.*tpdm_west.*$/\/\* & \*\//' "$file"
            fi
          done

          # 2. 修复 sm6150-coresight.dtsi 第440行语法错误
          if [ -f arch/arm64/boot/dts/qcom/sm6150-coresight.dtsi ]; then
            echo "Fixing sm6150-coresight.dtsi line 440"
            # 注释掉第440行
            sed -i '440s/^/\/\* /; 440s/$/ \*\//' arch/arm64/boot/dts/qcom/sm6150-coresight.dtsi
          fi

      - name: Load defconfig
        run: |
          cd "$GITHUB_WORKSPACE"
          make O="$OUT" ARCH="$ARCH" "$DEFCONFIG"

      - name: Enable KernelSU and Droidspaces kernel configs
        run: |
          cd "$GITHUB_WORKSPACE"
          CONFIG="$OUT/.config"

          # 启用 KernelSU (使用 kprobe 方式)
          ./scripts/config --file "$CONFIG" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU \
            --disable KSU_MANUAL_HOOK

          # 启用 Droidspaces
          ./scripts/config --file "$CONFIG" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          # 禁用 Android 网络隔离
          ./scripts/config --file "$CONFIG" --disable ANDROID_PARANOID_NETWORK || true

          # 禁用栈保护 (Clang 兼容性)
          ./scripts/config --file "$CONFIG" \
            --disable CC_STACKPROTECTOR_STRONG \
            --enable CC_STACKPROTECTOR_NONE

          # 禁用 bpfilter (避免链接警告)
          ./scripts/config --file "$CONFIG" --disable BPFILTER || true

          # 重新生成配置
          make O="$OUT" ARCH="$ARCH" olddefconfig

      - name: Verify required configs
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "Kernel version: $(make O="$OUT" ARCH="$ARCH" kernelversion)"
          echo "KernelSU configs:"
          grep -E '^CONFIG_(KSU|KPROBES|KPROBE_EVENTS)=' "$OUT/.config" || true
          echo "Checking Droidspaces configs:"
          MISSING=0
          for cfg in SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_PIDS MEMCG CGROUP_SCHED FAIR_GROUP_SCHED CGROUP_FREEZER CGROUP_NET_PRIO DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER VETH BRIDGE BRIDGE_NETFILTER NETFILTER NETFILTER_ADVANCED NF_CONNTRACK NF_CONNTRACK_IPV4 NF_NAT NF_NAT_IPV4 IP_NF_IPTABLES IP_NF_FILTER IP_NF_NAT IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_RECENT NF_NAT_REDIRECT IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES; do
            if grep -q "^CONFIG_${cfg}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${cfg}=y"
            else
              echo "MISS CONFIG_${cfg}"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "ERROR: Missing Droidspaces configs"
            exit 1
          fi
          echo "All required configs present."

      - name: Build kernel (Image.gz, dtbs, modules)
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="$CLANG_BIN:$PATH"
          export CC="ccache clang"
          make -j"$(nproc)" O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz dtbs modules
          test -f "$OUT/arch/arm64/boot/Image.gz"

      - name: Verify build output
        run: |
          ls -lh "$OUT/arch/arm64/boot/Image.gz"
          echo "Kernel version: $(make O="$OUT" ARCH="$ARCH" kernelversion)"
          ccache --show-stats || true

      # ============================================================
      # 下载官方 LineageOS boot.img 模板
      # ============================================================
      - name: Download stock images
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/boot.img" "$BOOT_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/dtbo.img" "$DTBO_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/recovery.img" "$RECOVERY_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/super_empty.img" "$SUPER_EMPTY_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/vbmeta.img" "$VBMETA_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/build-manifest.xml" "$MANIFEST_URL"
          ls -lh "$RUNNER_TEMP/images"

      # ============================================================
      # 使用 Android Image Kitchen 替换内核并重新打包
      # ============================================================
      - name: Get Android Image Kitchen
        run: |
          git clone --depth=1 https://github.com/osm0sis/Android-Image-Kitchen.git "$RUNNER_TEMP/AIK"
          chmod +x "$RUNNER_TEMP/AIK/unpackimg.sh" "$RUNNER_TEMP/AIK/repackimg.sh"
          echo "AIK=$RUNNER_TEMP/AIK" >> "$GITHUB_ENV"

      - name: Unpack stock boot.img
        run: |
          cd "$AIK"
          rm -rf split_img ramdisk boot.img image-new.img
          cp "$RUNNER_TEMP/images/boot.img" boot.img
          ./unpackimg.sh -i boot.img
          test -d split_img
          test -f split_img/boot.img-kernel

      - name: Replace kernel with compiled Image.gz
        run: |
          cp "$OUT/arch/arm64/boot/Image.gz" "$AIK/split_img/boot.img-kernel"
          test -f "$AIK/split_img/boot.img-kernel"

      - name: Repack boot.img
        run: |
          cd "$AIK"
          ./repackimg.sh
          test -f image-new.img
          cp image-new.img "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      # ============================================================
      # 生成校验和和发布文件
      # ============================================================
      - name: Generate SHA256 checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum boot-kernelsu-droidspaces.img > boot-kernelsu-droidspaces.img.sha256
          sha256sum "$RUNNER_TEMP/images/dtbo.img" "$RUNNER_TEMP/images/recovery.img" "$RUNNER_TEMP/images/super_empty.img" "$RUNNER_TEMP/images/vbmeta.img" "$RUNNER_TEMP/images/build-manifest.xml" > original-files.sha256

      - name: Create release notes
        run: |
          cd "$GITHUB_WORKSPACE"
          KERNEL_VERSION="$(make O="$OUT" ARCH="$ARCH" kernelversion)"
          cat > RELEASE.txt <<EOF
          Redmi Note 7 Pro (violet) Kernel with KernelSU v0.9.5 + Droidspaces

          ROM: LineageOS 23.2
          ROM build: ${ROM_BUILD}
          Kernel version: ${KERNEL_VERSION}
          Root: KernelSU v0.9.5 (non-GKI)
          Droidspaces: Enabled
          Architecture: arm64
          Build commit: ${GITHUB_SHA}

          Main file: boot-kernelsu-droidspaces.img
          Matching ROM: lineage-23.2-${ROM_BUILD}-nightly-violet

          Flash command: fastboot flash boot boot-kernelsu-droidspaces.img
          EOF
          cat RELEASE.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernelsu-${{ env.ROM_BUILD }}
          path: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
            RELEASE.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "violet-${{ env.ROM_BUILD }}-${{ github.sha }}"
          name: "violet KernelSU v0.9.5 + Droidspaces ${{ env.ROM_BUILD }}"
          body_path: RELEASE.txt
          files: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
