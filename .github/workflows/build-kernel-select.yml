name: Violet Kernel Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/sdmsteppe-perf_defconfig
      OUT: ${{ github.workspace }}/out

      BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
      DTBO_URL: https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img
      RECOVERY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img
      SUPER_EMPTY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img
      VBMETA_URL: https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img
      MANIFEST_URL: https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Setup Android Clang
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/clang"

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/clang"

          if [ ! -x "$RUNNER_TEMP/clang/clang-r383902/bin/clang" ]; then
            echo "ERROR: clang-r383902 not found"
            find "$RUNNER_TEMP/clang" -maxdepth 3 -name clang -type f
            exit 1
          fi

          echo "$RUNNER_TEMP/clang/clang-r383902/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/clang/clang-r383902/bin/clang" --version

      - name: Setup cross compiler
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/cross"

          PREFIX="$RUNNER_TEMP/cross/aarch64-linux-androidkernel-"

          ln -sf "$(command -v aarch64-linux-gnu-ld)" \
            "${PREFIX}ld"

          ln -sf "$(command -v aarch64-linux-gnu-as)" \
            "${PREFIX}as"

          ln -sf "$(command -v aarch64-linux-gnu-objcopy)" \
            "${PREFIX}objcopy"

          ln -sf "$(command -v aarch64-linux-gnu-objdump)" \
            "${PREFIX}objdump"

          ln -sf "$(command -v aarch64-linux-gnu-nm)" \
            "${PREFIX}nm"

          ln -sf "$(command -v aarch64-linux-gnu-strip)" \
            "${PREFIX}strip"

          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - name: Configure toolchain
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          CC=clang
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          OBJSIZE=llvm-size
          STRIP=llvm-strip
          CROSS_COMPILE=$RUNNER_TEMP/cross/aarch64-linux-androidkernel-
          CLANG_TRIPLE=aarch64-linux-gnu-
          LLVM=1
          LLVM_IAS=0
          EOF

      - name: Verify source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          test -d drivers
          test -f Makefile
          test -f Kconfig

          echo "Kernel source OK"
          echo "Commit: $(git rev-parse HEAD)"

      # ------------------------------------------------------------
      # KernelSU-Next
      # ------------------------------------------------------------

      - name: Install KernelSU-Next
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " KernelSU-Next"
          echo "========================================"

          rm -rf KernelSU-Next

          git clone \
            --depth=1 \
            --branch next \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          cd KernelSU-Next

          bash kernel/setup.sh "$GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE"

          test -d KernelSU-Next

          echo
          echo "KernelSU-Next installed."

          if [ -L drivers/kernelsu ]; then
            echo "drivers/kernelsu symlink OK"
          elif [ -d drivers/kernelsu ]; then
            echo "drivers/kernelsu directory OK"
          else
            echo "ERROR: drivers/kernelsu not found"
            exit 1
          fi

      # ------------------------------------------------------------
      # Defconfig
      # ------------------------------------------------------------

      - name: Generate defconfig
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf "$OUT"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ------------------------------------------------------------
      # KernelSU + Droidspaces configuration
      # ------------------------------------------------------------

      - name: Configure kernel
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          ./scripts/config \
            --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU

          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          ./scripts/config \
            --file "$OUT/.config" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            olddefconfig

      # ------------------------------------------------------------
      # Verify configuration
      # ------------------------------------------------------------

      - name: Verify configuration
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          for CONFIG in \
            KPROBES \
            KPROBE_EVENTS \
            KSU
          do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              exit 1
            fi
          done

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              exit 1
            fi
          done

          echo
          echo "========================================"
          echo " Configuration OK"
          echo "========================================"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build kernel
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " BUILD"
          echo "========================================"

          make -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            Image.gz \
            dtbs \
            modules

          test -f "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "BUILD SUCCESS"

      # ------------------------------------------------------------
      # Download boot image
      # ------------------------------------------------------------

      - name: Download boot image
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/stock"

          curl -fL --retry 5 \
            "$BOOT_URL" \
            -o "$RUNNER_TEMP/stock/boot.img"

          test -s "$RUNNER_TEMP/stock/boot.img"

          ls -lh "$RUNNER_TEMP/stock/boot.img"

      # ------------------------------------------------------------
      # Download Magisk boot tool
      # ------------------------------------------------------------

      - name: Download magiskboot
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/magisk"

          curl -fL --retry 5 \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
            -o "$RUNNER_TEMP/magisk/Magisk.apk"

          unzip -j \
            "$RUNNER_TEMP/magisk/Magisk.apk" \
            'lib/x86_64/libmagiskboot.so' \
            -d "$RUNNER_TEMP/magisk"

          mv \
            "$RUNNER_TEMP/magisk/libmagiskboot.so" \
            "$RUNNER_TEMP/magisk/magiskboot"

          chmod +x \
            "$RUNNER_TEMP/magisk/magiskboot

          test -x "$RUNNER_TEMP/magisk/magiskboot"

      # ------------------------------------------------------------
      # Unpack boot
      # ------------------------------------------------------------

      - name: Unpack boot
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            "$RUNNER_TEMP/stock/boot.img" \
            "$RUNNER_TEMP/boot/stock-boot.img"

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack \
            stock-boot.img

          test -f kernel

          echo "Original boot kernel:"
          file kernel

      # ------------------------------------------------------------
      # Replace kernel
      # ------------------------------------------------------------

      - name: Replace kernel
        run: |
          set -e

          cd "$RUNNER_TEMP/boot"

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            kernel

          echo "New boot kernel:"
          file kernel

      # ------------------------------------------------------------
      # Repack boot
      # ------------------------------------------------------------

      - name: Repack boot
        run: |
          set -e

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack \
            stock-boot.img \
            violet-droidspaces-kernelsu.img

          test -s violet-droidspaces-kernelsu.img

          ls -lh violet-droidspaces-kernelsu.img

      # ------------------------------------------------------------
      # Prepare release
      # ------------------------------------------------------------

      - name: Prepare release
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/release"

          cp \
            "$RUNNER_TEMP/boot/violet-droidspaces-kernelsu.img" \
            "$RUNNER_TEMP/release/"

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/release/"

          cp \
            "$OUT/.config" \
            "$RUNNER_TEMP/release/kernel.config"

          cat > "$RUNNER_TEMP/release/build-info.txt" <<EOF
          Device: Redmi Note 7 Pro
          Codename: violet
          ROM: LineageOS 23.2
          ROM Build: 20260826
          Kernel: $(make -s O="$OUT" ARCH="$ARCH" kernelversion)
          Defconfig: $DEFCONFIG
          KernelSU: KernelSU-Next
          KernelSU Mode: legacy
          SUSFS: disabled
          Droidspaces: enabled
          LLVM: clang-r383902
          LLVM_IAS: 0
          Source commit: $(git rev-parse HEAD)
          KernelSU commit: $(git -C KernelSU-Next rev-parse HEAD)
          Actions run: $GITHUB_RUN_NUMBER
          EOF

          cd "$RUNNER_TEMP/release"

          sha256sum \
            violet-droidspaces-kernelsu.img \
            Image.gz \
            kernel.config \
            build-info.txt \
            > sha256sum.txt

          echo
          echo "========================================"
          echo " RELEASE FILES"
          echo "========================================"

          ls -lah

          echo
          cat sha256sum.txt

      # ------------------------------------------------------------
      # Actions artifact
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-droidspaces-kernelsu-${{ github.run_number }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidspaces-${{ github.run_number }}
          name: Redmi Note 7 Pro - Droidspaces + KernelSU-Next #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/violet-droidspaces-kernelsu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt
