name: MultiVariant Kernel Build | SM6150 violet
on:
  workflow_dispatch:
  push:

env:
  DEFCONFIG: vendor/violet_defconfig
  ARCH: arm64
  STOCK_BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
  KERNEL_REPO: ${{ github.repository }}

jobs:
  build-variant:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: droidspaces-only
            apply_droidspaces_patch: true
            apply_ksu: false
            apply_susfs: false
          - name: droidspaces+ksu
            apply_droidspaces_patch: true
            apply_ksu: true
            apply_susfs: false
          - name: droidspaces+ksu+susfs
            apply_droidspaces_patch: true
            apply_ksu: true
            apply_susfs: true

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git ccache build-essential libssl-dev libelf-dev bison flex dwarves curl wget
          git config --global user.name "GithubCI"
          git config --global user.email "ci@github.com"

      - name: Cache ccache ${{ matrix.variant.name }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-${{ matrix.variant.name }}-${{ github.sha }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.variant.name }}-

      # ZyC Clang，加--no-tags提速
      - name: Download ZyC Clang
        run: |
          git clone --depth=1 --no-tags https://github.com/ZyCromerZ/Clang clang
          echo "CLANG_PATH=$PWD/clang/bin" >> $GITHUB_ENV
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # ========== MagiskBoot，curl优先，wget备选 双重保险 ==========
      - name: Get magiskboot binary
        run: |
          mkdir -p mkboot
          cd mkboot
          if curl -L --fail https://github.com/topjohnwu/Magisk/releases/download/v28.0/magiskboot -o magiskboot; then
            echo "curl download success"
          elif wget --no-verbose https://github.com/topjohnwu/Magisk/releases/download/v28.0/magiskboot -O magiskboot; then
            echo "wget fallback download success"
          else
            echo "magiskboot download failed"
            exit 1
          fi
          chmod +x magiskboot
          echo "BOOT_TOOLS=$PWD" >> $GITHUB_ENV

      - name: Download official stock boot.img
        run: |
          if curl -L --fail ${{ env.STOCK_BOOT_URL }} -o stock-boot.img; then
            echo "stock boot.img curl download success"
          elif wget --no-verbose ${{ env.STOCK_BOOT_URL }} -O stock-boot.img; then
            echo "stock boot.img wget fallback success"
          else
            echo "stock boot.img download failed"
            exit 1
          fi
          [ -f stock-boot.img ] || { echo "stock-boot.img missing"; exit 1; }
          ls -la stock-boot.img

      - name: Apply Droidspaces Non-GKI patches
        if: matrix.variant.apply_droidspaces_patch == true
        run: |
          git clone --depth=1 --no-tags https://github.com/ravindu644/Droidspaces-OSS droidspaces-src
          cd droidspaces-src/assets/resources/kernel-patches/non-GKI
          for p in *.patch; do
            echo "Applying Droidspaces patch: $p"
            git apply --verbose --3way --directory=../../../../ "$p"
          done
          cd ../../../../

      - name: Integrate KernelSU-Next legacy
        if: matrix.variant.apply_ksu == true
        run: |
          curl -LSs --fail "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply SUSFS4KSU 4.14 patches
        if: matrix.variant.apply_susfs == true
        run: |
          git clone --depth=1 --no-tags https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b kernel-4.14
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          for patch in susfs4ksu/kernel_patches/*.patch; do
            echo "Applying SUSFS patch: $patch"
            git apply --verbose --3way "$patch"
          done

      - name: Apply kernel config
        run: |
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          ./scripts/config --file out/.config \
          -e KPROBES \
          -e KPROBE_EVENTS \
          -e BPF \
          -e BPF_SYSCALL \
          -e KALLSYMS \
          -e KALLSYMS_ALL \
          -e MODULES \
          -e MODULE_UNLOAD \
          -e DEBUG_INFO \
          -e DEBUG_INFO_BTF \
          -e SYSVIPC \
          -e IPC_NS \
          -e PID_NS \
          -e MOUNT_NS \
          -e UTS_NS \
          -e USER_NS \
          -e NET_NS \
          -e CGROUPS \
          -e CGROUP_FREEZER \
          -e CGROUP_PIDS \
          -e CGROUP_DEVICES \
          -e CGROUP_CPUACCT \
          -e CGROUP_SCHED \
          -e MEMCG \
          -e SECCOMP \
          -e SECCOMP_FILTER \
          -e DEVTMPFS \
          -e DEVTMPFS_MOUNT \
          -e NETFILTER \
          -e NETFILTER_XTABLES \
          -e IP_NF_FILTER \
          -e IP6_NF_FILTER \
          -d ANDROID_PARANOID_NETWORK

          if [ "${{ matrix.variant.apply_ksu }}" = "true" ]; then
            ./scripts/config --file out/.config -e KSU
          fi
          if [ "${{ matrix.variant.apply_susfs }}" = "true" ]; then
            ./scripts/config --file out/.config \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SUS_SU
          fi
          cp out/.config arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}

      - name: Compile kernel ${{ matrix.variant.name }}
        run: |
          export PATH=${{ env.CLANG_PATH }}:$PATH
          make -j$(nproc) O=out ARCH=${{ env.ARCH }} CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Copy kernel image and rename for variant
        run: |
          cp out/arch/${{ env.ARCH }}/boot/Image.gz-dtb ./Image-${{ matrix.variant.name }}.gz-dtb
          [ -f Image-${{ matrix.variant.name }}.gz-dtb ] || { echo "Kernel image build failed!"; exit 1; }
          ls -la Image-${{ matrix.variant.name }}.gz-dtb

      # Magiskboot解包
      - name: Unpack stock boot.img
        run: |
          rm -rf boot_unpack
          mkdir boot_unpack
          cd boot_unpack
          ${{ env.BOOT_TOOLS }}/magiskboot unpack ../stock-boot.img
          [ -f kernel ] || { echo "unpack failed, no kernel extracted"; exit 1; }

      # 替换kernel，打包新boot
      - name: Replace kernel and repack boot ${{ matrix.variant.name }}
        run: |
          cp Image-${{ matrix.variant.name }}.gz-dtb boot_unpack/kernel
          cd boot_unpack
          ${{ env.BOOT_TOOLS }}/magiskboot repack ../stock-boot.img ../boot-${{ matrix.variant.name }}.img
          cd ..
          [ -f boot-${{ matrix.variant.name }}.img ] || { echo "repack boot failed"; exit 1; }
          ls -la boot-${{ matrix.variant.name }}.img

      - name: Generate SHA256 ${{ matrix.variant.name }}
        run: |
          sha256sum Image-${{ matrix.variant.name }}.gz-dtb boot-${{ matrix.variant.name }}.img > sha256-${{ matrix.variant.name }}.txt

      - name: Upload per-variant Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant.name }}
          path: |
            Image-${{ matrix.variant.name }}.gz-dtb
            boot-${{ matrix.variant.name }}.img
            sha256-${{ matrix.variant.name }}.txt

  release:
    name: Create Release (collect all variants)
    needs: build-variant
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: ls -R ./artifacts

      - name: Collect all files for release
        run: |
          mkdir -p release-files
          find ./artifacts -type f -exec cp {} ./release-files/ \;
          ls -la ./release-files

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag_name: violet-multi-kernel-$(date +%Y%m%d)
          name: Multi-Variant Kernel | SM6150/violet Droidspaces+KSU+SUSFS
          body: |
            ## Build Info
            - Device: Redmi Note7 Pro violet SM6150
            - ROM: lineage-23.2
            - Toolchain: ZyC Clang
            - Boot Tool: MagiskBoot v28.0
            ### Variants
            1. **boot-droidspaces-only.img**: Droidspaces only, no KSU/SUSFS（基础测试）
            2. **boot-droidspaces+ksu.img**: Droidspaces + KernelSU-Next（无SUSFS）
            3. **boot-droidspaces+ksu+susfs.img**: Full Droidspaces+KSU+SUSFS（目标完整版）

            ### Flash Instructions
            Violet是A/B分区，**必须刷对应slot**
            ```bash
            fastboot flash boot_a boot-xxx.img
            fastboot flash boot_b boot-xxx.img
            fastboot reboot
