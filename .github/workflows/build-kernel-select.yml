name: Violet Kernel - Droidspaces + KernelSU-Next

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  # Redmi Note 7 Pro / violet
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  # LineageOS 23.2 build
  ROM_BUILD: "20260826"

  # Official LineageOS images
  BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
  DTBO_URL: https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img
  RECOVERY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img
  SUPER_EMPTY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img
  VBMETA_URL: https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img
  MANIFEST_URL: https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml

  # KernelSU-Next
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_BRANCH: legacy

  # IMPORTANT:
  # Kernel 4.14 requires old Android Clang.
  # We do NOT hard-code clang-r383902 anymore.
  CLANG_ROOT: /opt/android-clang

jobs:

  build:
    name: Build violet kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel source
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. Install build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # 3. Git configuration
      # ============================================================

      - name: Configure git
        run: |
          set -eux

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git config --global \
            url."https://android.googlesource.com/".insteadOf \
            git://android.googlesource.com/

          git config --global \
            core.compression 0

          git config --global \
            http.version HTTP/1.1

      # ============================================================
      # 4. Cache Android Clang
      # ============================================================

      - name: Cache Android Clang
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CLANG_ROOT }}
          key: android-clang-violet-v4
          restore-keys: |
            android-clang-violet-

      # ============================================================
      # 5. Setup Android Clang
      #
      # Automatically finds a usable old Android Clang.
      # No clang-r383902 hard dependency.
      # ============================================================

      - name: Setup Android Clang
        shell: bash
        run: |
          set -eux

          mkdir -p "$CLANG_ROOT"

          find_clang() {
            find "$CLANG_ROOT" \
              -type f \
              -path "*/bin/clang" \
              -perm -111 \
              2>/dev/null | head -n 1
          }

          EXISTING_CLANG="$(find_clang || true)"

          if [ -n "$EXISTING_CLANG" ]; then
            echo "========================================"
            echo " Android Clang cache HIT"
            echo "========================================"
            echo "$EXISTING_CLANG"
          else
            echo "========================================"
            echo " Android Clang cache MISS"
            echo "========================================"

            rm -rf "$CLANG_ROOT"
            mkdir -p "$CLANG_ROOT"

            git clone \
              --depth=1 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$CLANG_ROOT"

            EXISTING_CLANG="$(find_clang || true)"

            if [ -z "$EXISTING_CLANG" ]; then
              echo "ERROR: No clang found in Android Clang repository."
              find "$CLANG_ROOT" -maxdepth 4 -type f -name clang -print
              exit 1
            fi
          fi

          CLANG_BIN="$(dirname "$EXISTING_CLANG")"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "========================================"
          echo " Selected Clang"
          echo "========================================"

          "$CLANG_BIN/clang" --version

      # ============================================================
      # 6. Configure LLVM tools
      # ============================================================

      - name: Configure LLVM toolchain
        run: |
          set -eux

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"

          # VERY IMPORTANT for this old 4.14 kernel.
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Setup AArch64 cross tools
      # ============================================================

      - name: Setup AArch64 cross compiler
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/cross"

          CROSS="$RUNNER_TEMP/cross/aarch64-linux-androidkernel-"

          ln -sf "$(command -v aarch64-linux-gnu-ld)" \
            "${CROSS}ld"

          ln -sf "$(command -v aarch64-linux-gnu-as)" \
            "${CROSS}as"

          ln -sf "$(command -v aarch64-linux-gnu-objcopy)" \
            "${CROSS}objcopy"

          ln -sf "$(command -v aarch64-linux-gnu-objdump)" \
            "${CROSS}objdump"

          ln -sf "$(command -v aarch64-linux-gnu-nm)" \
            "${CROSS}nm"

          ln -sf "$(command -v aarch64-linux-gnu-strip)" \
            "${CROSS}strip"

          echo "CROSS_COMPILE=$CROSS" >> "$GITHUB_ENV"

      # ============================================================
      # 8. ccache configuration
      # ============================================================

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=8G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --zero-stats || true

      # ============================================================
      # 9. Cache ccache
      # ============================================================

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-violet-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-violet-${{ runner.os }}-${{ github.ref_name }}-
            ccache-violet-${{ runner.os }}-

      # ============================================================
      # 10. Cache KernelSU-Next
      # ============================================================

      - name: Cache KernelSU-Next
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/KernelSU-Next
          key: kernelsu-next-legacy-v1
          restore-keys: |
            kernelsu-next-legacy-

      # ============================================================
      # 11. Install KernelSU-Next
      # ============================================================

      - name: Install KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          if [ -d "$RUNNER_TEMP/KernelSU-Next/.git" ]; then
            echo "KernelSU-Next cache HIT"

            cd "$RUNNER_TEMP/KernelSU-Next"

            git fetch \
              --depth=1 \
              origin \
              "$KSU_BRANCH"

            git checkout \
              -B "$KSU_BRANCH" \
              "origin/$KSU_BRANCH"
          else
            echo "KernelSU-Next cache MISS"

            rm -rf "$RUNNER_TEMP/KernelSU-Next"

            git clone \
              --depth=1 \
              --branch "$KSU_BRANCH" \
              "$KSU_REPO" \
              "$RUNNER_TEMP/KernelSU-Next"
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU

          # KernelSU-Next setup.sh must be executed
          # from the actual kernel source root.
          bash \
            "$RUNNER_TEMP/KernelSU-Next/kernel/setup.sh" \
            "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " KernelSU result"
          echo "========================================"

          test -d KernelSU

          ls -lah KernelSU

      # ============================================================
      # 12. Prepare output directory
      # ============================================================

      - name: Prepare kernel output
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          mkdir -p "$OUT"

          echo "OUT=$OUT"

      # ============================================================
      # 13. Generate original defconfig
      # ============================================================

      - name: Generate defconfig
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ============================================================
      # 14. Configure KernelSU + Droidspaces
      # ============================================================

      - name: Configure KernelSU and Droidspaces
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          ./scripts/config \
            --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU

          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          ./scripts/config \
            --file "$OUT/.config" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

      # ============================================================
      # 15. Verify configuration
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          for CONFIG in \
            KPROBES \
            KPROBE_EVENTS \
            KSU
          do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              exit 1
            fi
          done

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required Droidspaces configuration is missing."
            exit 1
          fi

          echo
          echo "========================================"
          echo " ALL CONFIGURATION PASSED"
          echo "========================================"

      # ============================================================
      # 16. Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          echo "========================================"
          echo " Build kernel"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            Image.gz \
            dtbs \
            modules

          test -f \
            "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "========================================"
          echo " Build finished"
          echo "========================================"

          ls -lh \
            "$OUT/arch/arm64/boot/Image.gz"

          ccache --show-stats || true

      # ============================================================
      # 17. Cache stock LineageOS images
      # ============================================================

      - name: Cache LineageOS images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stock
          key: lineage-violet-${{ env.ROM_BUILD }}-images-v1
          restore-keys: |
            lineage-violet-${{ env.ROM_BUILD }}-

      # ============================================================
      # 18. Download stock boot.img
      # ============================================================

      - name: Download stock boot.img
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/stock"

          if [ -s "$RUNNER_TEMP/stock/boot.img" ]; then
            echo "boot.img cache HIT"
          else
            curl \
              -fL \
              --retry 5 \
              --retry-delay 5 \
              "$BOOT_URL" \
              -o "$RUNNER_TEMP/stock/boot.img"
          fi

          test -s "$RUNNER_TEMP/stock/boot.img"

          ls -lh \
            "$RUNNER_TEMP/stock/boot.img"

      # ============================================================
      # 19. Cache Magisk boot tools
      # ============================================================

      - name: Cache Magisk tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/magisk
          key: magisk-tools-v1
          restore-keys: |
            magisk-tools-

      # ============================================================
      # 20. Setup magiskboot
      # ============================================================

      - name: Setup magiskboot
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/magisk"

          if [ -x "$RUNNER_TEMP/magisk/magiskboot" ]; then
            echo "magiskboot cache HIT"
          else
            echo "magiskboot cache MISS"

            rm -rf "$RUNNER_TEMP/magisk"

            mkdir -p "$RUNNER_TEMP/magisk"

            curl \
              -fL \
              --retry 5 \
              --retry-delay 5 \
              https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
              -o "$RUNNER_TEMP/magisk/Magisk.apk"

            unzip -j \
              "$RUNNER_TEMP/magisk/Magisk.apk" \
              'lib/x86_64/libmagiskboot.so' \
              -d "$RUNNER_TEMP/magisk"

            mv \
              "$RUNNER_TEMP/magisk/libmagiskboot.so" \
              "$RUNNER_TEMP/magisk/magiskboot"

            chmod +x \
              "$RUNNER_TEMP/magisk/magiskboot"
          fi

          test -x \
            "$RUNNER_TEMP/magisk/magiskboot"

      # ============================================================
      # 21. Unpack stock boot.img
      # ============================================================

      - name: Unpack boot.img
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/boot"

          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            "$RUNNER_TEMP/stock/boot.img" \
            "$RUNNER_TEMP/boot/stock-boot.img"

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack \
            stock-boot.img

          test -f kernel

      # ============================================================
      # 22. Replace kernel
      # ============================================================

      - name: Replace kernel
        run: |
          set -eux

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/boot/kernel"

          test -s \
            "$RUNNER_TEMP/boot/kernel"

      # ============================================================
      # 23. Repack boot.img
      # ============================================================

      - name: Repack boot.img
        run: |
          set -eux

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack \
            stock-boot.img \
            violet-droidspaces-kernelsu.img

          test -s \
            violet-droidspaces-kernelsu.img

          ls -lh \
            violet-droidspaces-kernelsu.img

      # ============================================================
      # 24. Prepare release files
      # ============================================================

      - name: Prepare release
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/release"

          mkdir -p "$RUNNER_TEMP/release"

          # Main flashable boot image
          cp \
            "$RUNNER_TEMP/boot/violet-droidspaces-kernelsu.img" \
            "$RUNNER_TEMP/release/"

          # Raw kernel
          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/release/"

          # Final config
          cp \
            "$OUT/.config" \
            "$RUNNER_TEMP/release/kernel.config"

          # Build information
          KERNEL_VERSION="$(
            make \
              -s \
              O="$OUT" \
              ARCH="$ARCH" \
              kernelversion
          )"

          KSU_COMMIT="$(
            git \
              -C "$GITHUB_WORKSPACE/KernelSU-Next" \
              rev-parse HEAD
          )"

          KSU_VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/KernelSU-Next" \
              describe \
              --tags \
              --always \
              2>/dev/null || true
          )"

          SOURCE_COMMIT="$(
            git \
              -C "$GITHUB_WORKSPACE" \
              rev-parse HEAD
          )"

          cat > "$RUNNER_TEMP/release/build-info.txt" <<EOF
          Device: Xiaomi Redmi Note 7 Pro
          Codename: violet

          ROM: LineageOS 23.2
          ROM build: $ROM_BUILD

          Kernel version: $KERNEL_VERSION
          Defconfig: $DEFCONFIG
          Architecture: arm64

          KernelSU: KernelSU-Next
          KernelSU branch: $KSU_BRANCH
          KernelSU version: $KSU_VERSION
          KernelSU commit: $KSU_COMMIT

          Droidspaces: enabled
          SUSFS: disabled

          LLVM IAS: 0

          Kernel source commit:
          $SOURCE_COMMIT

          GitHub Actions run:
          $GITHUB_RUN_NUMBER

          GitHub commit:
          $GITHUB_SHA
          EOF

          cd "$RUNNER_TEMP/release"

          sha256sum \
            violet-droidspaces-kernelsu.img \
            Image.gz \
            kernel.config \
            build-info.txt \
            > sha256sum.txt

          echo
          echo "========================================"
          echo " Release files"
          echo "========================================"

          ls -lah

      # ============================================================
      # 25. Upload Artifact
      #
      # This uses the already compiled files.
      # NO SECOND BUILD.
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-droidspaces-kernelsu-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release/violet-droidspaces-kernelsu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. Create GitHub Release
      #
      # Uses SAME build output.
      # NO SECOND COMPILATION.
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: violet-droidspaces-${{ github.run_number }}
          name: Redmi Note 7 Pro - Droidspaces + KernelSU-Next #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true

          files: |
            ${{ runner.temp }}/release/violet-droidspaces-kernelsu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt

      # ============================================================
      # 27. Final summary
      # ============================================================

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo " Violet kernel build"
          echo "========================================"
          echo
          echo "Device      : Redmi Note 7 Pro"
          echo "Codename    : violet"
          echo "ROM         : LineageOS 23.2"
          echo "ROM build   : 20260826"
          echo "KernelSU    : KernelSU-Next"
          echo "SUSFS       : disabled"
          echo "Droidspaces : enabled"
          echo "LLVM_IAS    : 0"
          echo
          echo "Commit      : $GITHUB_SHA"
          echo "Run         : $GITHUB_RUN_NUMBER"
          echo
          echo "Release:"
          echo "violet-droidspaces-$GITHUB_RUN_NUMBER"
          echo
          echo "========================================"
