name: Redmi Note 7 Pro Kernel

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: "legacy"

  CLANG_VERSION: "clang-r596125"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            curl \
            wget \
            git \
            zip \
            unzip \
            rsync \
            python3 \
            device-tree-compiler \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            lz4 \
            cpio \
            lzop \
            xz-utils \
            zstd \
            file


      # ============================================================
      # ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/.ccache"

          ccache \
            --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"

          ccache \
            --set-config=max_size=5G

          ccache \
            --zero-stats


      # ============================================================
      # Android Clang cache
      # ============================================================

      - name: Restore Android Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-clang
          key: android-clang-${{ env.CLANG_VERSION }}-v2
          restore-keys: |
            android-clang-${{ env.CLANG_VERSION }}-

      - name: Download Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/android-clang"

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/android-clang"

          test -d "$RUNNER_TEMP/android-clang"

          echo "Available clang versions:"
          find \
            "$RUNNER_TEMP/android-clang" \
            -maxdepth 2 \
            -type d \
            -name "clang-*" \
            -print


      # ============================================================
      # Setup Clang
      # ============================================================

      - name: Setup Clang
        run: |
          set -eux

          CLANG_BIN=""

          if [ -x "$RUNNER_TEMP/android-clang/$CLANG_VERSION/bin/clang" ]; then
            CLANG_BIN="$RUNNER_TEMP/android-clang/$CLANG_VERSION/bin"
          fi

          if [ -z "$CLANG_BIN" ]; then
            FOUND="$(find \
              "$RUNNER_TEMP/android-clang" \
              -type f \
              -path "*/bin/clang" \
              -print \
              | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              CLANG_BIN="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang not found"

            find \
              "$RUNNER_TEMP/android-clang" \
              -type f \
              -path "*/bin/clang" \
              -print || true

            exit 1
          fi

          echo "Using Clang:"
          echo "$CLANG_BIN"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          export PATH="$CLANG_BIN:$PATH"

          clang --version
          ld.lld --version


      # ============================================================
      # KernelSU-Next cache
      # ============================================================

      - name: Restore KernelSU-Next
        id: ksu-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/KernelSU-Next-cache
          key: kernelsu-next-${{ env.KSU_BRANCH }}-v2
          restore-keys: |
            kernelsu-next-${{ env.KSU_BRANCH }}-

      - name: Download KernelSU-Next
        if: steps.ksu-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/KernelSU-Next-cache"

          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            "$RUNNER_TEMP/KernelSU-Next-cache"

          cd "$RUNNER_TEMP/KernelSU-Next-cache"

          git fetch --tags || true

          test -f kernel/setup.sh

          git status


      # ============================================================
      # Setup KernelSU-Next
      # ============================================================

      - name: Setup KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU
          rm -rf KernelSU-Next

          cp -a \
            "$RUNNER_TEMP/KernelSU-Next-cache" \
            "$GITHUB_WORKSPACE/KernelSU-Next"

          cd "$GITHUB_WORKSPACE/KernelSU-Next"

          git config remote.origin.fetch \
            '+refs/heads/*:refs/remotes/origin/*'

          git fetch origin "$KSU_BRANCH" --depth=1 || true

          git fetch --tags || true

          cd "$GITHUB_WORKSPACE"

          bash KernelSU-Next/kernel/setup.sh

          echo "========================================"
          echo " KernelSU result"
          echo "========================================"

          test -e KernelSU

          ls -lah KernelSU

          echo "KernelSU-Next setup successful"


      # ============================================================
      # Prepare output directory
      # ============================================================

      - name: Prepare build directory
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf "$GITHUB_WORKSPACE/out"

          mkdir -p "$GITHUB_WORKSPACE/out"


      # ============================================================
      # Defconfig
      # ============================================================

      - name: Generate defconfig
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$GITHUB_WORKSPACE/out/.config"


      # ============================================================
      # Configure KernelSU + Droidspaces
      # ============================================================

      - name: Configure KernelSU and Droidspaces
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          export PATH="$CLANG_BIN:$PATH"

          echo "========================================"
          echo " Enabling KernelSU"
          echo "========================================"

          scripts/config \
            --file "$CONFIG" \
            --enable CONFIG_KSU

          scripts/config \
            --file "$CONFIG" \
            --enable CONFIG_KPROBES

          scripts/config \
            --file "$CONFIG" \
            --enable CONFIG_KPROBE_EVENTS


          echo "========================================"
          echo " Enabling Droidspaces"
          echo "========================================"

          CONFIGS="
          CONFIG_SYSCTL
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_NET_NS
          CONFIG_USER_NS
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_CGROUPS
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_PIDS
          CONFIG_MEMCG
          CONFIG_CGROUP_SCHED
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_NET_PRIO
          CONFIG_DEVTMPFS
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_FW_LOADER
          CONFIG_FW_LOADER_USER_HELPER
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_BRIDGE_NETFILTER
          CONFIG_NETFILTER
          CONFIG_NETFILTER_ADVANCED
          CONFIG_NF_CONNTRACK
          CONFIG_NF_CONNTRACK_IPV4
          CONFIG_NF_NAT
          CONFIG_NF_NAT_IPV4
          CONFIG_IP_NF_IPTABLES
          CONFIG_IP_NF_FILTER
          CONFIG_IP_NF_NAT
          CONFIG_IP_NF_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_TCPMSS
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_NF_CONNTRACK_NETLINK
          CONFIG_NF_NAT_REDIRECT
          CONFIG_IP_ADVANCED_ROUTER
          CONFIG_IP_MULTIPLE_TABLES
          "

          for CONFIG_NAME in $CONFIGS; do
            scripts/config \
              --file "$CONFIG" \
              --enable "$CONFIG_NAME" || true
          done


          echo "========================================"
          echo " olddefconfig"
          echo "========================================"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            olddefconfig


      # ============================================================
      # Verify configuration
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            kernelversion


          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          grep "^CONFIG_KSU" "$CONFIG" || true
          grep "^CONFIG_KPROBE" "$CONFIG" || true

          grep -q "^CONFIG_KSU=y" "$CONFIG"
          grep -q "^CONFIG_KPROBES=y" "$CONFIG"


          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED="
          CONFIG_SYSCTL
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_NET_NS
          CONFIG_USER_NS
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_CGROUPS
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_PIDS
          CONFIG_MEMCG
          CONFIG_CGROUP_SCHED
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_NET_PRIO
          CONFIG_DEVTMPFS
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_FW_LOADER
          CONFIG_FW_LOADER_USER_HELPER
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_BRIDGE_NETFILTER
          CONFIG_NF_CONNTRACK
          CONFIG_NF_NAT
          CONFIG_IP_NF_IPTABLES
          CONFIG_IP_NF_FILTER
          CONFIG_IP_NF_NAT
          CONFIG_IP_NF_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_TCPMSS
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE
          CONFIG_NF_CONNTRACK_NETLINK
          CONFIG_NF_NAT_REDIRECT
          CONFIG_IP_ADVANCED_ROUTER
          CONFIG_IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG_NAME in $REQUIRED; do
            if grep -q "^${CONFIG_NAME}=y" "$CONFIG"; then
              echo "OK   ${CONFIG_NAME}=y"
            else
              echo "MISS ${CONFIG_NAME}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Droidspaces configuration incomplete"
            exit 1
          fi


      # ============================================================
      # Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          export CC="ccache clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export READELF="llvm-readelf"
          export STRIP="llvm-strip"

          export LLVM=1
          export LLVM_IAS=0

          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            Image.gz \
            dtbs \
            modules

          test -f \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"

          echo "========================================"
          echo " BUILD SUCCESS"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"


      # ============================================================
      # ccache statistics
      # ============================================================

      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats || true


      # ============================================================
      # Download LineageOS images
      # ============================================================

      - name: Download LineageOS images
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/lineage"

          cd "$RUNNER_TEMP/lineage"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o boot.img \
            "$BOOT_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o dtbo.img \
            "$DTBO_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o recovery.img \
            "$RECOVERY_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o super_empty.img \
            "$SUPER_EMPTY_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o vbmeta.img \
            "$VBMETA_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o build-manifest.xml \
            "$MANIFEST_URL"

          ls -lh


      # ============================================================
      # Download magiskboot
      # ============================================================

      - name: Download magiskboot
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/magiskboot"

          cd "$RUNNER_TEMP/magiskboot"

          curl \
            -L \
            --fail \
            --retry 5 \
            -o magiskboot \
            https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot

          chmod +x magiskboot

          ./magiskboot --help || true


      # ============================================================
      # Repack boot.img
      # ============================================================

      - name: Repack boot image
        run: |
          set -eux

          WORK="$RUNNER_TEMP/boot-work"

          rm -rf "$WORK"

          mkdir -p "$WORK"

          cp \
            "$RUNNER_TEMP/lineage/boot.img" \
            "$WORK/boot.img"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" \
            "$WORK/Image.gz"

          cd "$WORK"

          "$RUNNER_TEMP/magiskboot/magiskboot" \
            unpack \
            boot.img

          test -f kernel

          cp \
            Image.gz \
            kernel

          "$RUNNER_TEMP/magiskboot/magiskboot" \
            repack \
            boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

          ls -lh \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"


      # ============================================================
      # Package release
      # ============================================================

      - name: Package release
        run: |
          set -eux

          RELEASE="$RUNNER_TEMP/release"

          rm -rf "$RELEASE"

          mkdir -p "$RELEASE"

          cp \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img" \
            "$RELEASE/"

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" \
            "$RELEASE/"

          cp \
            "$RUNNER_TEMP/lineage/dtbo.img" \
            "$RELEASE/"

          cp \
            "$RUNNER_TEMP/lineage/recovery.img" \
            "$RELEASE/"

          cp \
            "$RUNNER_TEMP/lineage/super_empty.img" \
            "$RELEASE/"

          cp \
            "$RUNNER_TEMP/lineage/vbmeta.img" \
            "$RELEASE/"

          cp \
            "$RUNNER_TEMP/lineage/build-manifest.xml" \
            "$RELEASE/"


          printf '%s\n' \
            'Redmi Note 7 Pro (violet)' \
            'LineageOS 23.2' \
            'ROM build: 20260826' \
            'Kernel: 4.14.357-openela' \
            'KernelSU-Next: legacy' \
            'Droidspaces: enabled' \
            'SUSFS: not included' \
            'Main file: boot-kernelsu-droidspaces.img' \
            'Original LineageOS boot.img was used as the base.' \
            'Keep your original boot.img backup.' \
            > "$RELEASE/README.txt"


          cd "$RELEASE"

          sha256sum \
            * \
            > SHA256SUMS

          ls -lah


      # ============================================================
      # Upload Artifact
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernel-${{ env.ROM_BUILD }}-${{ github.run_number }}"
          name: "Redmi Note 7 Pro Kernel ${{ env.ROM_BUILD }} #${{ github.run_number }}"
          body: "Redmi Note 7 Pro violet / LineageOS 23.2 / KernelSU-Next legacy / Droidspaces enabled / SUSFS not included. Main file: boot-kernelsu-droidspaces.img"
          files: "${{ runner.temp }}/release/*"
          draft: false
          prerelease: false
          make_latest: true
