name: Build Redmi Note 7 Pro Kernel

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig
  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: "legacy"
  CLANG_VERSION: "clang-r596125"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential ccache curl wget git zip unzip rsync python3 device-tree-compiler libssl-dev libelf-dev libncurses-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lz4 cpio lzop xz-utils zstd file

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=5G

      - name: Restore Android Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-clang
          key: android-clang-${{ env.CLANG_VERSION }}

      - name: Download Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/android-clang"
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$RUNNER_TEMP/android-clang"

      - name: Setup Clang
        run: |
          set -eux

          CLANG_BIN=""

          if [ -x "$RUNNER_TEMP/android-clang/$CLANG_VERSION/bin/clang" ]; then
            CLANG_BIN="$RUNNER_TEMP/android-clang/$CLANG_VERSION/bin"
          fi

          if [ -z "$CLANG_BIN" ]; then
            FOUND="$(find "$RUNNER_TEMP/android-clang" -type f -path "*/bin/clang" -print | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              CLANG_BIN="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang not found"
            find "$RUNNER_TEMP/android-clang" -type f -path "*/bin/clang" -print || true
            exit 1
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          export PATH="$CLANG_BIN:$PATH"

          clang --version
          ld.lld --version

      - name: Restore KernelSU-Next
        id: ksu-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/KernelSU-Next
          key: kernelsu-next-${{ env.KSU_BRANCH }}
          restore-keys: |
            kernelsu-next-${{ env.KSU_BRANCH }}-

      - name: Download KernelSU-Next
        if: steps.ksu-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/KernelSU-Next"

          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            "$RUNNER_TEMP/KernelSU-Next"

      - name: Setup KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU
          rm -rf KernelSU-Next

          cp -a "$RUNNER_TEMP/KernelSU-Next" "$GITHUB_WORKSPACE/KernelSU-Next"

          bash KernelSU-Next/kernel/setup.sh

          test -e KernelSU

          echo "KernelSU installed successfully"

      - name: Prepare kernel config
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"

          export PATH="$CLANG_BIN:$PATH"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$GITHUB_WORKSPACE/out/.config"

      - name: Configure KernelSU and Droidspaces
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          export PATH="$CLANG_BIN:$PATH"

          scripts/config --file "$CONFIG" --enable CONFIG_KSU
          scripts/config --file "$CONFIG" --enable CONFIG_KPROBES
          scripts/config --file "$CONFIG" --enable CONFIG_KPROBE_EVENTS

          CONFIGS="
          CONFIG_SYSCTL
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_NET_NS
          CONFIG_USER_NS
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_CGROUPS
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_PIDS
          CONFIG_MEMCG
          CONFIG_CGROUP_SCHED
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_NET_PRIO
          CONFIG_DEVTMPFS
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_FW_LOADER
          CONFIG_FW_LOADER_USER_HELPER
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_BRIDGE_NETFILTER
          CONFIG_NETFILTER
          CONFIG_NETFILTER_ADVANCED
          CONFIG_NF_CONNTRACK
          CONFIG_NF_CONNTRACK_IPV4
          CONFIG_NF_NAT
          CONFIG_NF_NAT_IPV4
          CONFIG_IP_NF_IPTABLES
          CONFIG_IP_NF_FILTER
          CONFIG_IP_NF_NAT
          CONFIG_IP_NF_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_TCPMSS
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_NF_CONNTRACK_NETLINK
          CONFIG_NF_NAT_REDIRECT
          CONFIG_IP_ADVANCED_ROUTER
          CONFIG_IP_MULTIPLE_TABLES
          "

          for CONFIG_NAME in $CONFIGS; do
            scripts/config --file "$CONFIG" --enable "$CONFIG_NAME" || true
          done

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            olddefconfig

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            kernelversion

          echo "========== KernelSU =========="

          grep "^CONFIG_KSU" "$CONFIG" || true

          grep -q "^CONFIG_KSU=y" "$CONFIG"

          echo "========== Droidspaces =========="

          REQUIRED="
          CONFIG_SYSCTL
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_NET_NS
          CONFIG_USER_NS
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_CGROUPS
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_PIDS
          CONFIG_MEMCG
          CONFIG_CGROUP_SCHED
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_NET_PRIO
          CONFIG_DEVTMPFS
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_FW_LOADER
          CONFIG_FW_LOADER_USER_HELPER
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_BRIDGE_NETFILTER
          CONFIG_NF_CONNTRACK
          CONFIG_NF_NAT
          CONFIG_IP_NF_IPTABLES
          CONFIG_IP_NF_FILTER
          CONFIG_IP_NF_NAT
          CONFIG_IP_NF_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_TCPMSS
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE
          CONFIG_NF_CONNTRACK_NETLINK
          CONFIG_NF_NAT_REDIRECT
          CONFIG_IP_ADVANCED_ROUTER
          CONFIG_IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG_NAME in $REQUIRED; do
            if grep -q "^${CONFIG_NAME}=y" "$CONFIG"; then
              echo "OK   ${CONFIG_NAME}=y"
            else
              echo "MISS ${CONFIG_NAME}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Droidspaces configuration incomplete"
            exit 1
          fi

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          export CC="ccache clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export READELF="llvm-readelf"
          export STRIP="llvm-strip"

          export LLVM=1
          export LLVM_IAS=0
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            Image.gz \
            dtbs \
            modules

          test -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"

          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          ls -lh "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"

      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true

      - name: Download LineageOS images
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/lineage"

          cd "$RUNNER_TEMP/lineage"

          curl -L --fail --retry 5 -o boot.img "$BOOT_URL"
          curl -L --fail --retry 5 -o dtbo.img "$DTBO_URL"
          curl -L --fail --retry 5 -o recovery.img "$RECOVERY_URL"
          curl -L --fail --retry 5 -o super_empty.img "$SUPER_EMPTY_URL"
          curl -L --fail --retry 5 -o vbmeta.img "$VBMETA_URL"
          curl -L --fail --retry 5 -o build-manifest.xml "$MANIFEST_URL"

          ls -lh

      - name: Download magiskboot
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/magiskboot"

          cd "$RUNNER_TEMP/magiskboot"

          curl -L --fail --retry 5 \
            -o magiskboot \
            https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot

          chmod +x magiskboot

      - name: Repack boot image
        run: |
          set -eux

          WORK="$RUNNER_TEMP/boot-work"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cp "$RUNNER_TEMP/lineage/boot.img" "$WORK/boot.img"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" "$WORK/Image.gz"

          cd "$WORK"

          "$RUNNER_TEMP/magiskboot/magiskboot" unpack boot.img

          test -f kernel

          cp Image.gz kernel

          "$RUNNER_TEMP/magiskboot/magiskboot" repack boot.img

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

          ls -lh "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      - name: Package release
        run: |
          set -eux

          RELEASE="$RUNNER_TEMP/release"

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          cp "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img" "$RELEASE/"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" "$RELEASE/"
          cp "$RUNNER_TEMP/lineage/dtbo.img" "$RELEASE/"
          cp "$RUNNER_TEMP/lineage/recovery.img" "$RELEASE/"
          cp "$RUNNER_TEMP/lineage/super_empty.img" "$RELEASE/"
          cp "$RUNNER_TEMP/lineage/vbmeta.img" "$RELEASE/"
          cp "$RUNNER_TEMP/lineage/build-manifest.xml" "$RELEASE/"

          printf '%s\n' \
            'Redmi Note 7 Pro (violet)' \
            'LineageOS 23.2' \
            'Build: 20260826' \
            'Kernel: 4.14.357-openela' \
            'Features: Droidspaces + KernelSU-Next legacy' \
            'SUSFS: not included' \
            'Main file: boot-kernelsu-droidspaces.img' \
            'Flash: fastboot flash boot boot-kernelsu-droidspaces.img' \
            'IMPORTANT: Keep your original boot.img backed up.' \
            > "$RELEASE/README.txt"

          cd "$RELEASE"

          sha256sum * > SHA256SUMS

          ls -lah

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "violet-kernel-${{ github.sha }}"
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernel-${{ env.ROM_BUILD }}-${{ github.run_number }}"
          name: "Redmi Note 7 Pro Kernel ${{ env.ROM_BUILD }} #${{ github.run_number }}"
          body: "Redmi Note 7 Pro violet / LineageOS 23.2 / KernelSU-Next legacy / Droidspaces / SUSFS not included. Main file: boot-kernelsu-droidspaces.img"
          files: "${{ runner.temp }}/release/*"
          draft: false
          prerelease: false
          make_latest: true
