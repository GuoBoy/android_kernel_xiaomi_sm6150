name: Build Redmi Note 7 Pro Kernel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  # 你的内核 defconfig
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  # ROM
  ROM_BUILD: "20260826"

  BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
  DTBO_URL: https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img
  RECOVERY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img
  SUPER_EMPTY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img
  VBMETA_URL: https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img
  MANIFEST_URL: https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml

  # KernelSU-Next
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_BRANCH: legacy

  # Android clang
  CLANG_VERSION: clang-r596125

  CC: clang
  LD: ld.lld
  AR: llvm-ar
  NM: llvm-nm
  OBJCOPY: llvm-objcopy
  OBJDUMP: llvm-objdump
  READELF: llvm-readelf
  OBJSIZE: llvm-size
  STRIP: llvm-strip

  LLVM: "1"

  # 4.14 kernel
  LLVM_IAS: "0"

  CLANG_TRIPLE: aarch64-linux-gnu-

  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            curl \
            wget \
            git \
            zip \
            unzip \
            rsync \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            lz4 \
            cpio \
            file \
            xz-utils

      # ============================================================
      # 3. ccache cache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache --zero-stats

      # ============================================================
      # 4. Android Clang cache
      # ============================================================

      - name: Restore Android Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/android-clang
          key: android-clang-${{ env.CLANG_VERSION }}-v1
          restore-keys: |
            android-clang-${{ env.CLANG_VERSION }}-

      - name: Download Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          mkdir -p "$HOME/android-clang"

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/android-clang"

      - name: Locate Clang
        run: |
          set -eux

          CLANG_BIN="$(find "$HOME/android-clang" \
            -type f \
            -path "*/${CLANG_VERSION}/bin/clang" \
            -print \
            -quit)"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: ${CLANG_VERSION} not found"
            echo
            echo "Available clang versions:"
            find "$HOME/android-clang" \
              -type f \
              -path "*/bin/clang" \
              -print
            exit 1
          fi

          CLANG_BIN_DIR="$(dirname "$CLANG_BIN")"

          echo "CLANG_BIN=$CLANG_BIN_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"

          "$CLANG_BIN" --version

      # ============================================================
      # 5. Cache KernelSU-Next
      # ============================================================

      - name: Restore KernelSU-Next cache
        id: ksu-cache
        uses: actions/cache@v4
        with:
          path: ~/KernelSU-Next
          key: kernelsu-next-${{ env.KSU_BRANCH }}-v1
          restore-keys: |
            kernelsu-next-${{ env.KSU_BRANCH }}-

      - name: Download KernelSU-Next
        if: steps.ksu-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$HOME/KernelSU-Next"

          git clone \
            --depth=1 \
            --branch "$KSU_BRANCH" \
            "$KSU_REPO" \
            "$HOME/KernelSU-Next"

      - name: Update KernelSU-Next
        if: steps.ksu-cache.outputs.cache-hit == 'true'
        run: |
          set -eux

          cd "$HOME/KernelSU-Next"

          git fetch \
            --depth=1 \
            origin \
            "$KSU_BRANCH"

          git reset \
            --hard \
            "origin/$KSU_BRANCH"

      # ============================================================
      # 6. KernelSU-Next setup
      # ============================================================

      - name: Setup KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU

          # setup.sh 不接受 kernel source 作为参数。
          # 它必须在 kernel source 根目录执行。
          bash "$HOME/KernelSU-Next/kernel/setup.sh"

          echo
          echo "========== KernelSU =========="

          test -e KernelSU

          ls -lah KernelSU

      # ============================================================
      # 7. Prepare output
      # ============================================================

      - name: Prepare build directory
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf out

          mkdir -p out

      # ============================================================
      # 8. Defconfig
      # ============================================================

      - name: Generate defconfig
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

      # ============================================================
      # 9. Enable Droidspaces + KernelSU
      # ============================================================

      - name: Configure Droidspaces and KernelSU
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          test -f "$CONFIG"

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          scripts/config --file "$CONFIG" \
            --enable KSU

          scripts/config --file "$CONFIG" \
            --enable KPROBES

          scripts/config --file "$CONFIG" \
            --enable KPROBE_EVENTS

          # KSU_KPROBE_HOOKS 在部分 KernelSU-Next 版本中
          # 并不存在，因此这里不强制开启。
          if grep -q 'config KSU_KPROBE_HOOKS' KernelSU/Kconfig 2>/dev/null; then
            scripts/config --file "$CONFIG" \
              --enable KSU_KPROBE_HOOKS || true
          fi

          # --------------------------------------------------------
          # Droidspaces
          # --------------------------------------------------------

          configs="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          for CONFIG_NAME in $configs; do
            if grep -q "^config ${CONFIG_NAME}" \
              "net/Kconfig" 2>/dev/null || \
               grep -Rqs "^config ${CONFIG_NAME}" \
              "net" "fs" "kernel" "init" "ipc" "security" \
              "drivers" "arch/arm64"; then

              scripts/config --file "$CONFIG" \
                --enable "$CONFIG_NAME" || true
            fi
          done

          # --------------------------------------------------------
          # Droidspaces specifically requested options
          # --------------------------------------------------------

          scripts/config --file "$CONFIG" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          # --------------------------------------------------------
          # Re-run old kernel Kconfig
          # --------------------------------------------------------

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "========== KernelSU =========="

          grep '^CONFIG_KSU' "$CONFIG" || true
          grep '^CONFIG_KPROBE' "$CONFIG" || true

          echo
          echo "========== Droidspaces =========="

          for CONFIG_NAME in $configs; do
            VALUE="$(grep "^CONFIG_${CONFIG_NAME}=" "$CONFIG" || true)"

            if [ -n "$VALUE" ]; then
              echo "OK   $VALUE"
            fi
          done

      # ============================================================
      # 10. Verify configuration
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          grep '^CONFIG_KSU' "$CONFIG" || true
          grep '^CONFIG_KPROBE' "$CONFIG" || true

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG_NAME in $REQUIRED; do

            if grep -q "^CONFIG_${CONFIG_NAME}=y" "$CONFIG"; then
              echo "OK   CONFIG_${CONFIG_NAME}=y"
            else
              echo "MISS CONFIG_${CONFIG_NAME}"
              FAILED=1
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "WARNING: Some optional/legacy Droidspaces configs are unavailable."
            echo "Continuing with available configuration."
          fi

      # ============================================================
      # 11. Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          export CROSS_COMPILE="aarch64-linux-gnu-"

          export CCACHE_DIR="$HOME/.ccache"

          export CC="ccache clang"

          clang --version

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            Image.gz \
            dtbs \
            modules

          test -f \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"

      # ============================================================
      # 12. Show ccache stats
      # ============================================================

      - name: ccache statistics
        run: |
          ccache --show-stats || true

      # ============================================================
      # 13. Download original LineageOS images
      # ============================================================

      - name: Download LineageOS images
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/release"

          cd "$GITHUB_WORKSPACE/release"

          curl -L --retry 5 --retry-delay 5 \
            -o original-boot.img \
            "$BOOT_URL"

          curl -L --retry 5 --retry-delay 5 \
            -o dtbo.img \
            "$DTBO_URL"

          curl -L --retry 5 --retry-delay 5 \
            -o recovery.img \
            "$RECOVERY_URL"

          curl -L --retry 5 --retry-delay 5 \
            -o super_empty.img \
            "$SUPER_EMPTY_URL"

          curl -L --retry 5 --retry-delay 5 \
            -o vbmeta.img \
            "$VBMETA_URL"

          curl -L --retry 5 --retry-delay 5 \
            -o build-manifest.xml \
            "$MANIFEST_URL"

      # ============================================================
      # 14. Prepare kernel Image
      # ============================================================

      - name: Prepare kernel files
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          cp \
            out/arch/arm64/boot/Image.gz \
            release/Image.gz

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} release/ \; \
            || true

          if [ -d out/lib/modules ]; then
            tar -czf \
              release/modules.tar.gz \
              -C out/lib \
              modules
          fi

          cp \
            out/.config \
            release/kernel.config

          echo
          echo "========== Release files =========="

          find release \
            -type f \
            -printf '%p %s bytes\n'

      # ============================================================
      # 15. Build boot.img using original boot image
      # ============================================================

      - name: Install MagiskBoot
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/magisk"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/magisk/magisk.apk" \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk

          unzip -o \
            "$RUNNER_TEMP/magisk/magisk.apk" \
            'lib/x86_64/libmagiskboot.so' \
            -d "$RUNNER_TEMP/magisk"

          cp \
            "$RUNNER_TEMP/magisk/lib/x86_64/libmagiskboot.so" \
            "$RUNNER_TEMP/magisk/magiskboot"

          chmod +x \
            "$RUNNER_TEMP/magisk/magiskboot"

          "$RUNNER_TEMP/magisk/magiskboot" --help || true

      # ============================================================
      # 16. Replace kernel inside boot.img
      # ============================================================

      - name: Pack modified boot.img
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            release/original-boot.img \
            "$RUNNER_TEMP/boot/boot.img"

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack boot.img

          test -f kernel

          cp \
            "$GITHUB_WORKSPACE/release/Image.gz" \
            kernel

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack boot.img \
            boot-new.img

          test -f boot-new.img

          cp \
            boot-new.img \
            "$GITHUB_WORKSPACE/release/boot.img"

          rm -f \
            "$GITHUB_WORKSPACE/release/original-boot.img"

      # ============================================================
      # 17. Generate checksums
      # ============================================================

      - name: Generate checksums
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/release"

          sha256sum \
            boot.img \
            Image.gz \
            dtbo.img \
            recovery.img \
            super_empty.img \
            vbmeta.img \
            build-manifest.xml \
            kernel.config \
            modules.tar.gz \
            2>/dev/null \
            > SHA256SUMS.txt || true

      # ============================================================
      # 18. Create release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}-${{ env.ROM_BUILD }}
          name: "Redmi Note 7 Pro Kernel - ${{ env.ROM_BUILD }} #${{ github.run_number }}"
          body: |
            Redmi Note 7 Pro / violet

            LineageOS:
            23.2 nightly 20260826

            Kernel:
            4.14.357-openela

            Features:
            - Droidspaces kernel configuration
            - KernelSU-Next legacy
            - SUSFS disabled

            Build:
            ${{ github.sha }}

            WARNING:
            Only flash boot.img if it matches your installed LineageOS build.
          files: |
            release/boot.img
            release/Image.gz
            release/dtbo.img
            release/recovery.img
            release/super_empty.img
            release/vbmeta.img
            release/build-manifest.xml
            release/kernel.config
            release/modules.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: false
          make_latest: true
