name: Redmi Note 7 Pro KernelSU Droidspaces

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  CLANG_VERSION: "clang-r547379"

  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: "legacy"

  AIK_REPO: "https://github.com/osm0sis/Android-Image-Kitchen.git"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libncurses5-dev libssl-dev lz4 \
            python3 rsync unzip wget xz-utils zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: violet-kernel-ccache-${{ runner.os }}-${{ hashFiles('Makefile', 'Kconfig', 'arch/**', 'drivers/**', 'fs/**', 'include/**', 'kernel/**', 'mm/**', 'net/**') }}
          restore-keys: |
            violet-kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -eux
          mkdir -p "$HOME/.ccache"
          ccache --max-size=5G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore Android clang cache
        id: clang_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: android-clang-${{ env.CLANG_VERSION }}-ubuntu-22.04-v1

      - name: Download Android clang
        if: steps.clang_cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/clang"
          rm -rf "$RUNNER_TEMP/android-clang-source"
          mkdir -p "$RUNNER_TEMP/clang"
          cd "$RUNNER_TEMP"
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            android-clang-source
          cd android-clang-source
          git sparse-checkout set clang-r547379
          test -d clang-r547379
          test -x clang-r547379/bin/clang
          cp -a clang-r547379/. "$RUNNER_TEMP/clang/"
          test -x "$RUNNER_TEMP/clang/bin/clang"
          cd "$RUNNER_TEMP"
          rm -rf android-clang-source

      - name: Check clang
        run: |
          set -eux
          CLANG_BIN="$RUNNER_TEMP/clang/bin"
          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"
          test -x "$CLANG_BIN/llvm-ar"
          test -x "$CLANG_BIN/llvm-nm"
          test -x "$CLANG_BIN/llvm-objcopy"
          test -x "$CLANG_BIN/llvm-objdump"
          test -x "$CLANG_BIN/llvm-readelf"
          test -x "$CLANG_BIN/llvm-size"
          test -x "$CLANG_BIN/llvm-strip"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "========================================"
          echo " Android Clang"
          echo "========================================"
          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

      - name: Configure LLVM
        run: |
          set -eux
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: Prepare output directory
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      - name: Integrate KernelSU-Next
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          rm -rf KernelSU KernelSU-Next
          git clone --depth=1 --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next
          test -f KernelSU-Next/kernel/setup.sh
          chmod +x KernelSU-Next/kernel/setup.sh
          bash KernelSU-Next/kernel/setup.sh
          echo
          echo "========================================"
          echo " KernelSU result"
          echo "========================================"
          test -d KernelSU-Next
          if [ ! -e KernelSU ]; then
            ln -sf KernelSU-Next KernelSU
          fi
          ls -lah KernelSU-Next
          ls -lah KernelSU

      - name: Load kernel defconfig
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          test -f Makefile
          test -d drivers
          test -f Kconfig
          make O="$OUT" ARCH="$ARCH" "$DEFCONFIG"
          test -f "$OUT/.config"

      - name: Enable KernelSU, Droidspaces, and disable stack protector
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          echo
          echo "========================================"
          echo " Enable KernelSU"
          echo "========================================"
          ./scripts/config --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU
          echo
          echo "========================================"
          echo " Enable Droidspaces"
          echo "========================================"
          ./scripts/config --file "$OUT/.config" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES
          ./scripts/config --file "$OUT/.config" \
            --disable ANDROID_PARANOID_NETWORK || true

          # 修正：禁用 stack protector strong，因为 Clang 不支持
          echo
          echo "========================================"
          echo " Disable stack protector strong"
          echo "========================================"
          ./scripts/config --file "$OUT/.config" \
            --disable CC_STACKPROTECTOR_STRONG \
            --enable CC_STACKPROTECTOR_NONE

          echo
          echo "========================================"
          echo " Running olddefconfig"
          echo "========================================"
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=0 olddefconfig
          test -f "$OUT/.config"

      - name: Verify final configuration
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          echo
          echo "========================================"
          echo " Kernel"
          echo "========================================"
          make O="$OUT" ARCH="$ARCH" kernelversion
          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"
          grep '^CONFIG_KPROBES=y' "$OUT/.config"
          grep '^CONFIG_KPROBE_EVENTS=y' "$OUT/.config"
          grep '^CONFIG_KSU=y' "$OUT/.config"
          echo "KernelSU configuration: OK"
          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"
          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NETFILTER_XT_MATCH_CONNTRACK
          NETFILTER_XT_MATCH_MULTIPORT
          NETFILTER_XT_MATCH_RECENT
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "
          FAILED=0
          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required Droidspaces configuration is missing."
            exit 1
          fi
          echo
          echo "========================================"
          echo " Configuration check PASSED"
          echo "========================================"

      - name: Build kernel
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          export PATH="$CLANG_BIN:$PATH"
          export CC="ccache clang"
          make -j"$(nproc)" O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=0 \
            CC="$CC" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz dtbs modules
          test -f "$OUT/arch/arm64/boot/Image.gz"

      - name: Verify kernel output
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          echo
          echo "========================================"
          echo " Kernel output"
          echo "========================================"
          ls -lh "$OUT/arch/arm64/boot/Image.gz"
          echo
          echo "========================================"
          echo " Kernel version"
          echo "========================================"
          make O="$OUT" ARCH="$ARCH" kernelversion
          echo
          echo "========================================"
          echo " ccache statistics"
          echo "========================================"
          ccache --show-stats || true

      - name: Download LineageOS images
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/images"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/boot.img" "$BOOT_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/dtbo.img" "$DTBO_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/recovery.img" "$RECOVERY_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/super_empty.img" "$SUPER_EMPTY_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/vbmeta.img" "$VBMETA_URL"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/images/build-manifest.xml" "$MANIFEST_URL"
          ls -lh "$RUNNER_TEMP/images"

      - name: Get Android Image Kitchen
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/AIK"
          git clone --depth=1 "$AIK_REPO" "$RUNNER_TEMP/AIK"
          chmod +x "$RUNNER_TEMP/AIK/unpackimg.sh" "$RUNNER_TEMP/AIK/repackimg.sh"
          echo "AIK=$RUNNER_TEMP/AIK" >> "$GITHUB_ENV"

      - name: Unpack boot image
        run: |
          set -eux
          cd "$AIK"
          rm -rf split_img ramdisk boot.img image-new.img
          cp "$RUNNER_TEMP/images/boot.img" boot.img
          ./unpackimg.sh -i boot.img
          test -d split_img
          test -f split_img/boot.img-kernel

      - name: Replace kernel image
        run: |
          set -eux
          cp "$OUT/arch/arm64/boot/Image.gz" "$AIK/split_img/boot.img-kernel"
          test -f "$AIK/split_img/boot.img-kernel"

      - name: Repack boot image
        run: |
          set -eux
          cd "$AIK"
          ./repackimg.sh
          test -f image-new.img
          cp image-new.img "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"
          test -f "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      - name: Generate checksums
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          sha256sum boot-kernelsu-droidspaces.img > boot-kernelsu-droidspaces.img.sha256
          sha256sum \
            "$RUNNER_TEMP/images/dtbo.img" \
            "$RUNNER_TEMP/images/recovery.img" \
            "$RUNNER_TEMP/images/super_empty.img" \
            "$RUNNER_TEMP/images/vbmeta.img" \
            "$RUNNER_TEMP/images/build-manifest.xml" \
            > original-files.sha256

      - name: Create release notes
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          KERNEL_VERSION="$(make O="$OUT" ARCH="$ARCH" kernelversion)"
          cat > RELEASE.txt <<EOF
          Redmi Note 7 Pro (violet)

          ROM:
          LineageOS 23.2

          ROM build:
          ${ROM_BUILD}

          Kernel:
          ${KERNEL_VERSION}

          Root:
          KernelSU-Next legacy

          Droidspaces:
          Enabled

          Architecture:
          arm64

          Build commit:
          ${GITHUB_SHA}

          Main file:
          boot-kernelsu-droidspaces.img

          Matching ROM:
          lineage-23.2-${ROM_BUILD}-nightly-violet

          KernelSU KPROBE hooks:
          Not required by this KernelSU-Next legacy configuration.
          EOF
          cat RELEASE.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernelsu-droidspaces-${{ env.ROM_BUILD }}
          path: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
            RELEASE.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "violet-${{ env.ROM_BUILD }}-${{ github.sha }}"
          name: "Redmi Note 7 Pro KernelSU + Droidspaces ${{ env.ROM_BUILD }}"
          body_path: RELEASE.txt
          files: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
