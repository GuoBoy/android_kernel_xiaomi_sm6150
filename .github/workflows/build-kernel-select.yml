- name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$RUNNER_TEMP/gcc64"

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$RUNNER_TEMP/gcc32"

          echo "$RUNNER_TEMP/gcc64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/gcc32/bin" >> "$GITHUB_PATH"

          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE"

          export PATH="$RUNNER_TEMP/gcc64/bin:$RUNNER_TEMP/gcc32/bin:$PATH"

          export CROSS_COMPILE="$RUNNER_TEMP/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$RUNNER_TEMP/gcc32/bin/arm-linux-androideabi-"

          export CLANG_PREBUILT_BIN="$RUNNER_TEMP/clang/clang-r416183b1/bin"
          export PATH="$CLANG_PREBUILT_BIN:$PATH"

          echo "========== Toolchain =========="
          clang --version
          aarch64-linux-android-gcc --version

          echo
          echo "========== Kernel =========="
          make kernelversion

          echo
          echo "========== Build =========="

          make -j"$(nproc)" \
            O="$OUT" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=0 \
            Image.gz \
            dtbs \
            modules
