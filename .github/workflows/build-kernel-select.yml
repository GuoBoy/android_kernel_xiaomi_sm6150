name: MultiVariant Kernel Build | SM6150 violet
on:
  workflow_dispatch:
  push:

env:
  DEFCONFIG: vendor/violet_defconfig
  ARCH: arm64
  STOCK_BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
  KERNEL_REPO: ${{ github.repository }}
  # 加ghproxy加速
  CLANG_URL: https://mirror.ghproxy.com/https://github.com/kdrag0n/proton-clang/releases/download/13.0.0-20220509/proton-clang-13.0.0-20220509.tar.zst
  CLANG_DIR: ${{ github.workspace }}/clang

jobs:
  build-variant:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: droidspaces-only
            apply_droidspaces_patch: true
            apply_ksu: false
            apply_susfs: false
          - name: droidspaces+ksu
            apply_droidspaces_patch: true
            apply_ksu: true
            apply_susfs: false
          - name: droidspaces+ksu+susfs
            apply_droidspaces_patch: true
            apply_ksu: true
            apply_susfs: true

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git ccache build-essential libssl-dev libelf-dev bison flex dwarves python3 python3-pip wget zstd
          git config --global user.name "GithubCI"
          git config --global user.email "ci@github.com"

      - name: Cache ccache ${{ matrix.variant.name }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-${{ matrix.variant.name }}-${{ github.sha }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.variant.name }}-

      # ========== 修复后的Clang下载解压 ==========
      - name: Download & Extract Proton Clang
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          wget --retry-connrefused --tries=3 ${{ env.CLANG_URL }} -O proton-clang.tar.zst
          zstd -d proton-clang.tar.zst
          tar -xf proton-clang.tar -C ${{ env.CLANG_DIR }}
          echo "CLANG_PATH=${{ env.CLANG_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.CLANG_DIR }}/bin" >> $GITHUB_PATH

      - name: Build mkbootimg / unpackbootimg tools
        run: |
          git clone https://github.com/osm0sis/mkbootimg.git mkboot --depth=1
          cd mkboot
          make
          echo "BOOT_TOOLS=$PWD" >> $GITHUB_ENV

      - name: Download official stock boot.img
        run: |
          wget -O stock-boot.img ${{ env.STOCK_BOOT_URL }}
          if [ ! -f stock-boot.img ];then echo "stock bootimg download failed"; exit 1; fi
          ls -la stock-boot.img

      - name: Apply Droidspaces Non-GKI patches
        if: matrix.variant.apply_droidspaces_patch == true
        run: |
          git clone https://github.com/ravindu644/Droidspaces-OSS droidspaces-src --depth=1
          cd droidspaces-src/assets/resources/kernel-patches/non-GKI
          for p in *.patch; do
            echo "Applying Droidspaces patch: $p"
            git apply --verbose --3way --directory=../../../../ $p
          done
          cd ../../../../

      - name: Integrate KernelSU-Next legacy
        if: matrix.variant.apply_ksu == true
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply SUSFS4KSU 4.14 patches
        if: matrix.variant.apply_susfs == true
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b kernel-4.14 --depth=1
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          for patch in susfs4ksu/kernel_patches/*.patch; do
            echo "Applying SUSFS patch: $patch"
            git apply --verbose --3way "$patch"
          done

      - name: Apply kernel config
        run: |
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          ./scripts/config --file out/.config \
          -e KPROBES \
          -e KPROBE_EVENTS \
          -e BPF \
          -e BPF_SYSCALL \
          -e KALLSYMS \
          -e KALLSYMS_ALL \
          -e MODULES \
          -e MODULE_UNLOAD \
          -e DEBUG_INFO \
          -e DEBUG_INFO_BTF \
          -e SYSVIPC \
          -e IPC_NS \
          -e PID_NS \
          -e MOUNT_NS \
          -e UTS_NS \
          -e USER_NS \
          -e NET_NS \
          -e CGROUPS \
          -e CGROUP_FREEZER \
          -e CGROUP_PIDS \
          -e CGROUP_DEVICES \
          -e CGROUP_CPUACCT \
          -e CGROUP_SCHED \
          -e MEMCG \
          -e SECCOMP \
          -e SECCOMP_FILTER \
          -e DEVTMPFS \
          -e DEVTMPFS_MOUNT \
          -e NETFILTER \
          -e NETFILTER_XTABLES \
          -e IP_NF_FILTER \
          -e IP6_NF_FILTER \
          -d ANDROID_PARANOID_NETWORK

          if [ "${{ matrix.variant.apply_ksu }}" = "true" ]; then
            ./scripts/config --file out/.config -e KSU
          fi
          if [ "${{ matrix.variant.apply_susfs }}" = "true" ]; then
            ./scripts/config --file out/.config \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SUS_SU
          fi
          cp out/.config arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}

      - name: Compile kernel ${{ matrix.variant.name }}
        run: |
          export PATH=${{ env.CLANG_PATH }}:$PATH
          make -j$(nproc) O=out ARCH=${{ env.ARCH }} CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Copy kernel image and rename for variant
        run: |
          cp out/arch/${{ env.ARCH }}/boot/Image.gz-dtb ./Image-${{ matrix.variant.name }}.gz-dtb
          ls -la Image-${{ matrix.variant.name }}.gz-dtb

      - name: Unpack stock boot.img
        run: |
          mkdir boot_unpack
          ${{ env.BOOT_TOOLS }}/unpackbootimg -i stock-boot.img -o boot_unpack

      - name: Replace kernel and repack boot ${{ matrix.variant.name }}
        run: |
          cp Image-${{ matrix.variant.name }}.gz-dtb boot_unpack/stock-boot.img-kernel
          cd boot_unpack
          ARGS=(
            --kernel stock-boot.img-kernel
            --ramdisk stock-boot.img-ramdisk
            --cmdline "$(cat stock-boot.img-cmdline)"
            --base "$(cat stock-boot.img-base)"
            --pagesize "$(cat stock-boot.img-pagesize)"
            --kernel_offset "$(cat stock-boot.img-kernel_offset)"
            --ramdisk_offset "$(cat stock-boot.img-ramdisk_offset)"
            --tags_offset "$(cat stock-boot.img-tags_offset)"
            --os_version "$(cat stock-boot.img-os_version)"
            --os_patch_level "$(cat stock-boot.img-os_patch_level)"
            --header_version "$(cat stock-boot.img-header_version)"
          )
          if [ -f "stock-boot.img-second" ]; then
            ARGS+=(--second stock-boot.img-second --second_offset "$(cat stock-boot.img-second_offset)")
          fi
          ${{ env.BOOT_TOOLS }}/mkbootimg "${ARGS[@]}" -o ../boot-${{ matrix.variant.name }}.img
          cd ..
          ls -la boot-${{ matrix.variant.name }}.img

      - name: Generate SHA256 ${{ matrix.variant.name }}
        run: |
          sha256sum Image-${{ matrix.variant.name }}.gz-dtb boot-${{ matrix.variant.name }}.img > sha256-${{ matrix.variant.name }}.txt

      - name: Upload per-variant Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant.name }}
          path: |
            Image-${{ matrix.variant.name }}.gz-dtb
            boot-${{ matrix.variant.name }}.img
            sha256-${{ matrix.variant.name }}.txt

  release:
    name: Create Release (collect all variants)
    needs: build-variant
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: ls -R ./artifacts

      - name: Collect all files for release
        run: |
          mkdir release-files
          find ./artifacts -type f -exec cp {} ./release-files/ \;
          ls -la ./release-files

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag_name: violet-multi-kernel-$(date +%Y%m%d)
          name: Multi-Variant Kernel | SM6150/violet Droidspaces+KSU+SUSFS
          body: |
            ## Build Info
            - Device: Redmi Note7 Pro violet SM6150
            - ROM: lineage-23.2
            - Toolchain: Proton Clang 13
            ### Variants
            1. **boot-droidspaces-only.img**: Droidspaces only, no KSU/SUSFS（基础测试）
            2. **boot-droidspaces+ksu.img**: Droidspaces + KernelSU-Next（无SUSFS）
            3. **boot-droidspaces+ksu+susfs.img**: Full Droidspaces+KSU+SUSFS（目标完整版）

            ### Flash Instructions
            Violet是A/B分区，**必须刷对应slot**
            ```bash
            fastboot flash boot_a boot-xxx.img
            fastboot flash boot_b boot-xxx.img
            fastboot reboot
