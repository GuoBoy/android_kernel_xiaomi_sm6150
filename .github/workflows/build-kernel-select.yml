name: Build Kernel for violet (LineageOS 23.2 + Droidspaces + KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      susfs_version:
        description: 'SUSFS version (tag)'
        required: false
        default: 'v1.5.5'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 0

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y git build-essential libssl-dev flex bison bc \
            libelf-dev ccache cpio python3 python3-pip lz4 \
            gcc-aarch64-linux-gnu abootimg wget unzip

      - name: Setup Clang toolchain
        run: |
          git clone --depth=1 -b android12-gsi \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

      - name: Clone KernelSU-Next (legacy for non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -
          mv KernelSU KernelSU-Next

      - name: Apply SUSFS patches
        run: |
          cd kernel
          git clone --depth=1 -b ${{ github.event.inputs.susfs_version }} \
            https://github.com/Star-Seven/susfs4ksu.git susfs
          
          PATCH_DIR="susfs/kernel_patches/4.19"
          if [ -d "$PATCH_DIR" ]; then
            for patch in $PATCH_DIR/*.patch; do
              patch -p1 < "$patch" || true
            done
          else
            for patch in susfs/kernel_patches/*.patch; do
              patch -p1 < "$patch" || true
            done
          fi
          
          cp -r susfs/susfs-ksu .
          echo "obj-y += susfs-ksu/" >> Makefile

      - name: Configure kernel (Droidspaces + KernelSU-Next + SUSFS)
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/violet_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/sm6150-perf_defconfig"
          fi
          
          cat >> "$DEFCONFIG" << 'EOF'
          # Droidspaces configs
          CONFIG_SYSCTL=y CONFIG_SYSVIPC=y CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y CONFIG_PID_NS=y CONFIG_UTS_NS=y CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y CONFIG_CGROUP_DEVICE=y CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y CONFIG_CGROUP_SCHED=y CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y CONFIG_FW_LOADER_USER_HELPER=y CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y CONFIG_VETH=y CONFIG_BRIDGE=y CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER=y CONFIG_NETFILTER_ADVANCED=y CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y CONFIG_IP_NF_FILTER=y CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y CONFIG_IP_NF_NAT=y
          
          # KernelSU-Next
          CONFIG_KPROBES=y CONFIG_HAVE_KPROBES=y CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y CONFIG_KSU=y CONFIG_KSU_LEGACY_NON_GKI=y
          CONFIG_KSU_WITH_HOOKS=y
          
          # SUSFS
          CONFIG_SUSFS=y CONFIG_SUSFS_HIDE_PROCESSES=y CONFIG_SUSFS_HIDE_MOUNTS=y
          CONFIG_SUSFS_USE_KSU_HOOKS=y CONFIG_SUSFS_SUS_SU=y CONFIG_SUSFS_ENABLE_LOG=y
          CONFIG_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_OWNER=y
          EOF

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PWD/../clang/bin:$PATH
          
          make -j$(nproc) O=out violet_defconfig
          make -j$(nproc) O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            Image.gz-dtb dtbo.img modules

      - name: Prepare AnyKernel3.zip (Recovery flash)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          cp ../kernel/out/arch/arm64/boot/dtbo.img .
          # 复制编译好的内核模块到 AnyKernel3 的模块目录（自动安装到 vendor）
          find ../kernel/out -name "*.ko" -exec cp {} . \;
          zip -r9 ../kernel-AnyKernel3.zip * .gitignore

      - name: Build boot.img for Fastboot
        run: |
          sudo apt install -y abootimg
          # 下载官方 LineageOS 的 boot.img 作为打包模板（提取 ramdisk）
          wget -O stock_boot.img https://mirrorbits.lineageos.org/full/violet/20260826/boot.img || true
          
          if [ -f stock_boot.img ]; then
            cd kernel
            # 解包官方 boot.img，提取 ramdisk 和打包参数
            abootimg -x ../stock_boot.img
            # 替换内核为编译好的 Image.gz-dtb
            cp out/arch/arm64/boot/Image.gz-dtb zImage
            # 重新打包成 boot.img
            abootimg --create ../boot.img -f bootimg.cfg -k zImage -r initrd.img
            cd ..
          else
            echo "⚠️ 无法下载官方 boot.img，跳过生成 boot.img，请使用 AnyKernel3.zip"
            # 生成一个空文件占位，避免 release 报错
            touch boot.img
          fi

      - name: Create Release and Upload
        id: create_release
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Kernel for violet - ${{ env.TAG }}"
          body: |
            ## 📦 刷机包说明
            - **AnyKernel3.zip**：在 Recovery (TWRP/OrangeFox) 中刷入（**最推荐**，会自动更新内核模块）
            - **boot.img**：使用 `fastboot flash boot boot.img` 刷入（如果模块不匹配导致 WiFi 异常，请换用 AnyKernel3.zip）
          files: |
            kernel-AnyKernel3.zip
            boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
