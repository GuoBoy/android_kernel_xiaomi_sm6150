name: Redmi Note 7 Pro KernelSU Droidspaces

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64

  # 你的 LineageOS 23.2 violet 内核
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  # 对应你当前使用的 ROM
  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  # Android 16 / LineageOS 23.x 时代的 clang
  CLANG_VERSION: "clang-r547379"

  # KernelSU-Next
  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_REF: "legacy"

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. 获取内核源码
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. 安装编译依赖
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. ccache
      #
      # 这个缓存最重要。
      # 第二次编译相同代码时可以明显减少编译时间。
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: violet-kernel-ccache-${{ runner.os }}-${{ hashFiles('**/Makefile', '**/Kconfig*', '**/*.h', '**/*.c', '**/*.S') }}
          restore-keys: |
            violet-kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$HOME/.ccache"

          ccache --max-size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ============================================================
      # 4. clang cache
      #
      # 不缓存 KernelSU。
      # 不缓存随机 Git 仓库。
      #
      # clang 是稳定的大文件，最适合 Actions cache。
      # ============================================================

      - name: Restore clang cache
        id: clang_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: android-clang-${{ env.CLANG_VERSION }}-linux-x86-v1

      # ============================================================
      # 5. 下载 Android clang
      #
      # 使用 Android 官方 googlesource。
      #
      # 不使用之前错误的 LineageOS GitHub 仓库地址。
      # ============================================================

      - name: Download Android clang
        if: steps.clang_cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/clang"

          mkdir -p "$RUNNER_TEMP/clang"

          cd "$RUNNER_TEMP"

          # Android 官方预编译 clang 仓库
          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            android-clang-source

          cd android-clang-source

          # 只取 clang-r547379
          git sparse-checkout init --cone

          git sparse-checkout set \
            "clang-r547379"

          git checkout \
            refs/tags/android-security-16.0.0_r7

          mkdir -p "$RUNNER_TEMP/clang"

          cp -a \
            clang-r547379/. \
            "$RUNNER_TEMP/clang/"

          cd "$RUNNER_TEMP"

          rm -rf android-clang-source

      # ============================================================
      # 6. 检查 clang
      # ============================================================

      - name: Check clang
        run: |
          set -eux

          CLANG_BIN="$RUNNER_TEMP/clang/bin"

          test -x "$CLANG_BIN/clang"
          test -x "$CLANG_BIN/ld.lld"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo " Android Clang"
          echo "========================================"

          "$CLANG_BIN/clang" --version

          "$CLANG_BIN/ld.lld" --version

      # ============================================================
      # 7. 设置 LLVM
      #
      # 你的内核是 Linux 4.14。
      #
      # LLVM_IAS=0：
      # 使用外部 assembler，避免之前遇到的旧内核
      # integrated assembler 问题。
      # ============================================================

      - name: Configure LLVM
        run: |
          set -eux

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 8. 创建 out
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/out"

          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ============================================================
      # 9. KernelSU-Next
      #
      # 不缓存 KernelSU-Next。
      #
      # 直接 clone 官方 legacy 分支，然后执行官方 setup.sh。
      #
      # 注意：
      # setup.sh 在 kernel 源码根目录执行。
      # ============================================================

      - name: Integrate KernelSU-Next
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            --branch "$KSU_REF" \
            "$KSU_REPO" \
            KernelSU-Next

          test -f KernelSU-Next/kernel/setup.sh

          chmod +x \
            KernelSU-Next/kernel/setup.sh

          bash \
            KernelSU-Next/kernel/setup.sh \
            "$KSU_REF"

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          test -e drivers/kernelsu

          ls -lah drivers/kernelsu

      # ============================================================
      # 10. Kernel defconfig
      # ============================================================

      - name: Load kernel defconfig
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ============================================================
      # 11. 设置 KernelSU + Droidspaces
      #
      # 不直接把配置文本 append 到 .config。
      #
      # 使用 scripts/config，然后 olddefconfig。
      # 这样依赖关系由 Kconfig 自动处理。
      # ============================================================

      - name: Enable KernelSU and Droidspaces
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          ./scripts/config \
            --file "$OUT/.config" \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU \
            --enable KSU_KPROBE_HOOKS

          # --------------------------------------------------------
          # Droidspaces
          # Linux 4.14 Legacy kernel
          # --------------------------------------------------------

          ./scripts/config \
            --file "$OUT/.config" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES

          # Droidspaces 文档明确建议旧内核关闭这个选项
          ./scripts/config \
            --file "$OUT/.config" \
            --disable ANDROID_PARANOID_NETWORK

          # --------------------------------------------------------
          # 根据 Kconfig 依赖重新生成配置
          # --------------------------------------------------------

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            olddefconfig

          test -f "$OUT/.config"

      # ============================================================
      # 12. 检查最终 config
      # ============================================================

      - name: Verify final configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          grep '^CONFIG_KPROBES=y' "$OUT/.config"
          grep '^CONFIG_KPROBE_EVENTS=y' "$OUT/.config"
          grep '^CONFIG_KSU=y' "$OUT/.config"
          grep '^CONFIG_KSU_KPROBE_HOOKS=y' "$OUT/.config"

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_CONNTRACK_NETLINK
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required configuration is missing."
            exit 1
          fi

      # ============================================================
      # 13. 编译内核
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

          test -f \
            "$OUT/arch/arm64/boot/Image.gz"

      # ============================================================
      # 14. 编译结果
      # ============================================================

      - name: Verify kernel output
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo " Kernel output"
          echo "========================================"

          ls -lh \
            "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "========================================"
          echo " Kernel version"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

      # ============================================================
      # 15. 下载匹配的 LineageOS boot.img
      # ============================================================

      - name: Download LineageOS images
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/images"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/boot.img" \
            "$BOOT_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/dtbo.img" \
            "$DTBO_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/recovery.img" \
            "$RECOVERY_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/super_empty.img" \
            "$SUPER_EMPTY_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/vbmeta.img" \
            "$VBMETA_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/build-manifest.xml" \
            "$MANIFEST_URL"

          ls -lh "$RUNNER_TEMP/images"

      # ============================================================
      # 16. 安装 Android Image Kitchen
      # ============================================================

      - name: Get Android Image Kitchen
        run: |
          set -eux

          rm -rf "$RUNNER_TEMP/AIK"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/Android-Image-Kitchen.git \
            "$RUNNER_TEMP/AIK"

          chmod +x \
            "$RUNNER_TEMP/AIK/unpackimg.sh" \
            "$RUNNER_TEMP/AIK/repackimg.sh"

          echo "AIK=$RUNNER_TEMP/AIK" >> "$GITHUB_ENV"

      # ============================================================
      # 17. 解包原始 boot.img
      # ============================================================

      - name: Unpack boot image
        run: |
          set -eux

          cd "$AIK"

          rm -rf \
            split_img \
            ramdisk \
            boot.img \
            image-new.img

          cp \
            "$RUNNER_TEMP/images/boot.img" \
            boot.img

          ./unpackimg.sh \
            -i boot.img

          test -d split_img

          test -f split_img/boot.img-kernel

      # ============================================================
      # 18. 替换 kernel
      # ============================================================

      - name: Replace kernel image
        run: |
          set -eux

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$AIK/split_img/boot.img-kernel"

          test -f \
            "$AIK/split_img/boot.img-kernel"

      # ============================================================
      # 19. 重新打包 boot.img
      # ============================================================

      - name: Repack boot image
        run: |
          set -eux

          cd "$AIK"

          ./repackimg.sh

          test -f image-new.img

          cp \
            image-new.img \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

          test -f \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      # ============================================================
      # 20. SHA256
      # ============================================================

      - name: Generate checksums
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            boot-kernelsu-droidspaces.img \
            > boot-kernelsu-droidspaces.img.sha256

          sha256sum \
            "$RUNNER_TEMP/images/dtbo.img" \
            "$RUNNER_TEMP/images/recovery.img" \
            "$RUNNER_TEMP/images/super_empty.img" \
            "$RUNNER_TEMP/images/vbmeta.img" \
            "$RUNNER_TEMP/images/build-manifest.xml" \
            > original-files.sha256

      # ============================================================
      # 21. Release 信息
      # ============================================================

      - name: Create release notes
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          KERNEL_VERSION="$(
            make \
              O="$OUT" \
              ARCH="$ARCH" \
              kernelversion
          )"

          cat > RELEASE.txt <<EOF
          Redmi Note 7 Pro (violet)

          ROM:
          LineageOS 23.2

          ROM build:
          ${ROM_BUILD}

          Kernel:
          ${KERNEL_VERSION}

          Root:
          KernelSU-Next legacy

          Droidspaces:
          Enabled

          Architecture:
          arm64

          Build commit:
          ${GITHUB_SHA}

          Main file:
          boot-kernelsu-droidspaces.img

          Matching ROM:
          lineage-23.2-${ROM_BUILD}-nightly-violet

          This boot image was built from the matching
          LineageOS kernel source and uses the matching
          LineageOS boot image as its base.
          EOF

          cat RELEASE.txt

      # ============================================================
      # 22. Actions Artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernelsu-droidspaces-${{ env.ROM_BUILD }}
          path: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
            RELEASE.txt
          retention-days: 30

      # ============================================================
      # 23. GitHub Release
      #
      # 注意：
      # 这里不会重新执行编译。
      #
      # 前面已经编译完了。
      # 这里直接把现成文件发布出去。
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "violet-${{ env.ROM_BUILD }}-${{ github.sha }}"
          name: "Redmi Note 7 Pro KernelSU + Droidspaces ${{ env.ROM_BUILD }}"
          body_path: RELEASE.txt
          files: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            original-files.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
