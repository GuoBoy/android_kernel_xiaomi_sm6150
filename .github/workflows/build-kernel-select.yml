name: Build Violet Droidspaces Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: vendor/sdmsteppe-perf_defconfig

      ROM_BUILD: "20260826"

      BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"

      DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"

      RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"

      SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"

      VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"

      MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Dependencies
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ==========================================================
      # 3. Android Clang
      # ==========================================================

      - name: Download Android Clang
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/toolchain/clang"

          CLANG_BIN=$(find \
            "$RUNNER_TEMP/toolchain/clang" \
            -type f \
            -name clang \
            | head -n1 \
            | xargs dirname)

          if [ -z "$CLANG_BIN" ]; then
            echo "clang not found"
            exit 1
          fi

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Check compiler
        run: |
          clang --version
          ld.lld --version

      # ==========================================================
      # 4. Kernel information
      # ==========================================================

      - name: Kernel information
        run: |
          cd "$KERNEL_DIR"

          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Branch:"
          git branch --show-current

      # ==========================================================
      # 5. Droidspaces patches
      # ==========================================================

      - name: Download Droidspaces patches
        run: |
          mkdir -p "$RUNNER_TEMP/droidspaces"

          curl -fL \
            -o "$RUNNER_TEMP/droidspaces/01.patch" \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"

          curl -fL \
            -o "$RUNNER_TEMP/droidspaces/02.patch" \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"

      - name: Apply Droidspaces patches
        run: |
          cd "$KERNEL_DIR"

          patch --dry-run -p1 < \
            "$RUNNER_TEMP/droidspaces/01.patch"

          patch --dry-run -p1 < \
            "$RUNNER_TEMP/droidspaces/02.patch"

          patch -p1 < \
            "$RUNNER_TEMP/droidspaces/01.patch"

          patch -p1 < \
            "$RUNNER_TEMP/droidspaces/02.patch"

      # ==========================================================
      # 6. KernelSU-Next
      # ==========================================================

      - name: Add KernelSU-Next
        run: |
          cd "$KERNEL_DIR"

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -

      # ==========================================================
      # 7. Generate base config
      # ==========================================================

      - name: Generate kernel config
        run: |
          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            "$DEFCONFIG"

      # ==========================================================
      # 8. Droidspaces config
      # ==========================================================

      - name: Configure Droidspaces
        run: |
          cd "$KERNEL_DIR"

          CONFIG="$OUT_DIR/.config"

          ./scripts/config --file "$CONFIG" \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable MNT_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable FW_LOADER_COMPRESS \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable NF_NAT \
            --enable NF_TABLES \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT_IPV4 \
            --disable ANDROID_PARANOID_NETWORK

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            olddefconfig

      # ==========================================================
      # 9. Verify config
      # ==========================================================

      - name: Verify configuration
        run: |
          cd "$KERNEL_DIR"

          echo "========== Kernel =========="

          make kernelversion

          echo
          echo "========== Droidspaces =========="

          grep -E \
            'CONFIG_(NAMESPACES|PID_NS|UTS_NS|IPC_NS|MNT_NS|NET_NS|USER_NS|SECCOMP|SECCOMP_FILTER|CGROUPS|CGROUP_DEVICE|CGROUP_PIDS|MEMCG|CGROUP_SCHED|CGROUP_FREEZER|OVERLAY_FS|DEVTMPFS|VETH|BRIDGE|BRIDGE_NETFILTER|NETFILTER)=' \
            "$OUT_DIR/.config" || true

          echo
          echo "========== KernelSU =========="

          grep -E \
            'CONFIG_KSU' \
            "$OUT_DIR/.config" || true

          if ! grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config"; then
            echo "ERROR: CONFIG_KSU=y not found"
            exit 1
          fi

          if ! grep -q '^CONFIG_PID_NS=y' "$OUT_DIR/.config"; then
            echo "ERROR: CONFIG_PID_NS=y not found"
            exit 1
          fi

      # ==========================================================
      # 10. Build
      # ==========================================================

      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

      # ==========================================================
      # 11. Download official LineageOS images
      # ==========================================================

      - name: Download official images
        run: |
          mkdir -p "$RUNNER_TEMP/stock"

          curl -fL \
            "$BOOT_URL" \
            -o "$RUNNER_TEMP/stock/boot.img"

          curl -fL \
            "$DTBO_URL" \
            -o "$RUNNER_TEMP/stock/dtbo.img"

          curl -fL \
            "$RECOVERY_URL" \
            -o "$RUNNER_TEMP/stock/recovery.img"

          curl -fL \
            "$SUPER_EMPTY_URL" \
            -o "$RUNNER_TEMP/stock/super_empty.img"

          curl -fL \
            "$VBMETA_URL" \
            -o "$RUNNER_TEMP/stock/vbmeta.img"

          curl -fL \
            "$MANIFEST_URL" \
            -o "$RUNNER_TEMP/stock/build-manifest.xml"

          ls -lh "$RUNNER_TEMP/stock"

      # ==========================================================
      # 12. Download magiskboot
      # ==========================================================

      - name: Download magiskboot
        run: |
          mkdir -p "$RUNNER_TEMP/magisk"

          curl -fL \
            "https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk" \
            -o "$RUNNER_TEMP/magisk/Magisk.apk"

          unzip -j \
            "$RUNNER_TEMP/magisk/Magisk.apk" \
            "lib/x86_64/libmagiskboot.so" \
            -d "$RUNNER_TEMP/magisk"

          mv \
            "$RUNNER_TEMP/magisk/libmagiskboot.so" \
            "$RUNNER_TEMP/magisk/magiskboot"

          chmod +x \
            "$RUNNER_TEMP/magisk/magiskboot"

          "$RUNNER_TEMP/magisk/magiskboot" --help || true

      # ==========================================================
      # 13. Repack boot.img
      # ==========================================================

      - name: Replace kernel and repack boot.img
        run: |
          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            "$RUNNER_TEMP/stock/boot.img" \
            "$RUNNER_TEMP/boot/stock-boot.img"

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack stock-boot.img

          echo "========== Unpacked boot =========="
          ls -lah

          if [ ! -f kernel ]; then
            echo "ERROR: magiskboot did not produce kernel"
            exit 1
          fi

          cp \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            kernel

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack stock-boot.img \
            violet-droidspaces-ksu.img

          if [ ! -f violet-droidspaces-ksu.img ]; then
            echo "ERROR: boot image repack failed"
            exit 1
          fi

          ls -lh violet-droidspaces-ksu.img

      # ==========================================================
      # 14. Prepare Release
      # ==========================================================

      - name: Prepare Release
        run: |
          mkdir -p "$RUNNER_TEMP/release"

          cp \
            "$RUNNER_TEMP/boot/violet-droidspaces-ksu.img" \
            "$RUNNER_TEMP/release/violet-droidspaces-ksu.img"

          cp \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/release/Image.gz"

          cp \
            "$RUNNER_TEMP/stock/dtbo.img" \
            "$RUNNER_TEMP/release/dtbo-stock.img"

          cp \
            "$RUNNER_TEMP/stock/recovery.img" \
            "$RUNNER_TEMP/release/recovery-stock.img"

          cp \
            "$RUNNER_TEMP/stock/super_empty.img" \
            "$RUNNER_TEMP/release/super_empty-stock.img"

          cp \
            "$RUNNER_TEMP/stock/vbmeta.img" \
            "$RUNNER_TEMP/release/vbmeta-stock.img"

          cp \
            "$RUNNER_TEMP/stock/build-manifest.xml" \
            "$RUNNER_TEMP/release/build-manifest.xml"

          cp \
            "$OUT_DIR/.config" \
            "$RUNNER_TEMP/release/kernel.config"

          git rev-parse HEAD \
            > "$RUNNER_TEMP/release/kernel.commit"

          git log -1 \
            --format='%H%n%s%n%ad' \
            --date=iso \
            > "$RUNNER_TEMP/release/kernel-info.txt"

          cat > "$RUNNER_TEMP/release/build-info.txt" <<EOF
          Device: Redmi Note 7 Pro
          Codename: violet
          ROM: LineageOS 23.2
          ROM build: 20260826
          Kernel: 4.14.357
          Defconfig: vendor/sdmsteppe-perf_defconfig
          Droidspaces: enabled
          KernelSU-Next: enabled
          SUSFS: disabled
          EOF

          cd "$RUNNER_TEMP/release"

          sha256sum * > sha256sum.txt

          ls -lah

      # ==========================================================
      # 15. Actions artifact
      # ==========================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-droidspaces-ksu
          path: ${{ runner.temp }}/release/

      # ==========================================================
      # 16. GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "droidspaces-${{ github.run_number }}"
          name: "Violet Droidspaces + KernelSU-Next ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true

          files: |
            ${{ runner.temp }}/release/violet-droidspaces-ksu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/dtbo-stock.img
            ${{ runner.temp }}/release/recovery-stock.img
            ${{ runner.temp }}/release/super_empty-stock.img
            ${{ runner.temp }}/release/vbmeta-stock.img
            ${{ runner.temp }}/release/build-manifest.xml
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/kernel.commit
            ${{ runner.temp }}/release/kernel-info.txt
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt
