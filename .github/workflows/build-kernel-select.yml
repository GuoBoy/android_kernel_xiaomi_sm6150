name: Violet Droidspaces KernelSU

on:
  push:
    branches:
      - lineage-23.2

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Redmi Note 7 Pro Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/sdmsteppe-perf_defconfig
      OUT: ${{ github.workspace }}/out

      CLANG_VERSION: clang-r383902

      BOOT_URL: https://mirrorbits.lineageos.org/full/violet/20260826/boot.img
      DTBO_URL: https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img
      RECOVERY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img
      SUPER_EMPTY_URL: https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img
      VBMETA_URL: https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img
      MANIFEST_URL: https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ==========================================================
      # Android Clang r383902
      # ==========================================================

      - name: Setup Android Clang
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/toolchain/clang"

          test -x \
            "$RUNNER_TEMP/toolchain/clang/${CLANG_VERSION}/bin/clang"

          echo "$RUNNER_TEMP/toolchain/clang/${CLANG_VERSION}/bin" \
            >> "$GITHUB_PATH"

          echo "========== CLANG =========="

          "$RUNNER_TEMP/toolchain/clang/${CLANG_VERSION}/bin/clang" \
            --version

      # ==========================================================
      # LLVM / binutils
      # ==========================================================

      - name: Check LLVM tools
        run: |
          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-readelf
          command -v llvm-strip

          clang --version
          ld.lld --version

      # ==========================================================
      # Cross compiler
      #
      # LineageOS 23.2 official SM6150 config:
      #
      # CROSS_COMPILE=aarch64-linux-androidkernel-
      # CLANG_TRIPLE=aarch64-linux-gnu-
      #
      # Ubuntu's aarch64-linux-gnu toolchain is used for the
      # external binutils required by this old 4.14 kernel.
      # ==========================================================

      - name: Setup cross compiler
        run: |
          mkdir -p "$RUNNER_TEMP/cross"

          ln -sf \
            "$(command -v aarch64-linux-gnu-ld)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-ld"

          ln -sf \
            "$(command -v aarch64-linux-gnu-as)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-as"

          ln -sf \
            "$(command -v aarch64-linux-gnu-objcopy)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-objcopy"

          ln -sf \
            "$(command -v aarch64-linux-gnu-objdump)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-objdump"

          ln -sf \
            "$(command -v aarch64-linux-gnu-nm)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-nm"

          ln -sf \
            "$(command -v aarch64-linux-gnu-strip)" \
            "$RUNNER_TEMP/cross/aarch64-linux-androidkernel-strip"

          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

          ls -lah "$RUNNER_TEMP/cross"

      # ==========================================================
      # KernelSU-Next
      # ==========================================================

      - name: Add KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE"

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh \
            | bash -

      # ==========================================================
      # Environment
      # ==========================================================

      - name: Configure build environment
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$RUNNER_TEMP/cross/aarch64-linux-androidkernel-" \
            >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

      # ==========================================================
      # Defconfig
      # ==========================================================

      - name: Generate defconfig
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf "$OUT"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

      # ==========================================================
      # Droidspaces configuration
      # ==========================================================

      - name: Configure Droidspaces
        run: |
          cd "$GITHUB_WORKSPACE"

          CONFIG="$OUT/.config"

          ./scripts/config --file "$CONFIG" \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable DEVTMPFS \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_HL \
            --enable NETFILTER_XT_TARGET_REJECT \
            --enable IP_NF_TARGET_REJECT \
            --enable NETFILTER_XT_TARGET_LOG \
            --enable IP_NF_TARGET_ULOG \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NETFILTER_XT_MATCH_LIMIT \
            --enable NETFILTER_XT_MATCH_HASHLIMIT \
            --enable NETFILTER_XT_MATCH_OWNER \
            --enable NETFILTER_XT_MATCH_PKTTYPE \
            --enable NETFILTER_XT_MATCH_MARK \
            --enable NETFILTER_XT_TARGET_MARK \
            --enable IP_SET \
            --enable IP_SET_HASH_IP \
            --enable IP_SET_HASH_NET \
            --enable NETFILTER_XT_SET \
            --enable NETFILTER_NETLINK_QUEUE \
            --enable NETFILTER_NETLINK_LOG \
            --enable NETFILTER_XT_TARGET_NFLOG \
            --enable NET_NS \
            --enable VETH \
            --enable BRIDGE \
            --enable BRIDGE_NETFILTER \
            --enable NF_CONNTRACK \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable IP_NF_NAT \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_TABLES \
            --enable USER_NS

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

      # ==========================================================
      # Verify configuration
      # ==========================================================

      - name: Verify configuration
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " Kernel version"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " KernelSU"
          echo "========================================"

          grep '^CONFIG_KSU' "$OUT/.config" || true

          echo
          echo "========================================"
          echo " Droidspaces"
          echo "========================================"

          REQUIRED_CONFIGS="
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          NETFILTER_XT_MATCH_CONNTRACK
          NETFILTER_XT_MATCH_MULTIPORT
          NETFILTER_XT_TARGET_REJECT
          NETFILTER_XT_MATCH_RECENT
          IP_SET
          NETFILTER_XT_SET
          NET_NS
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NF_CONNTRACK
          NF_NAT
          IP_NF_IPTABLES
          IP_NF_NAT
          USER_NS
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required Droidspaces configuration is missing."
            exit 1
          fi

      # ==========================================================
      # Build kernel
      # ==========================================================

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE"

          make -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            OBJSIZE="$OBJSIZE" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            Image \
            Image.gz \
            dtbs \
            modules

          test -f "$OUT/arch/arm64/boot/Image"
          test -f "$OUT/arch/arm64/boot/Image.gz"

      # ==========================================================
      # Download official LineageOS 20260826 images
      # ==========================================================

      - name: Download LineageOS images
        run: |
          mkdir -p "$RUNNER_TEMP/stock"

          curl -fL "$BOOT_URL" \
            -o "$RUNNER_TEMP/stock/boot.img"

          curl -fL "$DTBO_URL" \
            -o "$RUNNER_TEMP/stock/dtbo.img"

          curl -fL "$RECOVERY_URL" \
            -o "$RUNNER_TEMP/stock/recovery.img"

          curl -fL "$SUPER_EMPTY_URL" \
            -o "$RUNNER_TEMP/stock/super_empty.img"

          curl -fL "$VBMETA_URL" \
            -o "$RUNNER_TEMP/stock/vbmeta.img"

          curl -fL "$MANIFEST_URL" \
            -o "$RUNNER_TEMP/stock/build-manifest.xml"

          ls -lh "$RUNNER_TEMP/stock"

      # ==========================================================
      # Magiskboot
      # ==========================================================

      - name: Get magiskboot
        run: |
          mkdir -p "$RUNNER_TEMP/magisk"

          curl -fL \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
            -o "$RUNNER_TEMP/magisk/Magisk.apk"

          unzip -j \
            "$RUNNER_TEMP/magisk/Magisk.apk" \
            'lib/x86_64/libmagiskboot.so' \
            -d "$RUNNER_TEMP/magisk"

          mv \
            "$RUNNER_TEMP/magisk/libmagiskboot.so" \
            "$RUNNER_TEMP/magisk/magiskboot"

          chmod +x \
            "$RUNNER_TEMP/magisk/magiskboot"

          "$RUNNER_TEMP/magisk/magiskboot" --help >/dev/null

      # ==========================================================
      # Unpack / replace kernel / repack boot
      # ==========================================================

      - name: Repack boot.img
        run: |
          mkdir -p "$RUNNER_TEMP/boot"

          cp \
            "$RUNNER_TEMP/stock/boot.img" \
            "$RUNNER_TEMP/boot/stock-boot.img"

          cd "$RUNNER_TEMP/boot"

          "$RUNNER_TEMP/magisk/magiskboot" \
            unpack stock-boot.img

          test -f kernel

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            kernel

          "$RUNNER_TEMP/magisk/magiskboot" \
            repack stock-boot.img \
            violet-droidspaces-ksu.img

          test -f violet-droidspaces-ksu.img

          ls -lh violet-droidspaces-ksu.img

      # ==========================================================
      # Prepare release
      # ==========================================================

      - name: Prepare release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"

          cp \
            "$RUNNER_TEMP/boot/violet-droidspaces-ksu.img" \
            "$RUNNER_TEMP/release/"

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$RUNNER_TEMP/release/"

          cp \
            "$OUT/arch/arm64/boot/Image" \
            "$RUNNER_TEMP/release/"

          cp \
            "$RUNNER_TEMP/stock/dtbo.img" \
            "$RUNNER_TEMP/release/dtbo-stock.img"

          cp \
            "$RUNNER_TEMP/stock/recovery.img" \
            "$RUNNER_TEMP/release/recovery-stock.img"

          cp \
            "$RUNNER_TEMP/stock/super_empty.img" \
            "$RUNNER_TEMP/release/super_empty-stock.img"

          cp \
            "$RUNNER_TEMP/stock/vbmeta.img" \
            "$RUNNER_TEMP/release/vbmeta-stock.img"

          cp \
            "$RUNNER_TEMP/stock/build-manifest.xml" \
            "$RUNNER_TEMP/release/build-manifest.xml"

          cp \
            "$OUT/.config" \
            "$RUNNER_TEMP/release/kernel.config"

          cat > "$RUNNER_TEMP/release/build-info.txt" <<EOF
          Device: Xiaomi Redmi Note 7 Pro
          Codename: violet
          ROM: LineageOS 23.2
          ROM build: 20260826
          Kernel: 4.14
          Defconfig: vendor/sdmsteppe-perf_defconfig
          Droidspaces: enabled
          KernelSU-Next: enabled
          SUSFS: disabled
          Toolchain: clang-r383902
          EOF

          cd "$RUNNER_TEMP/release"

          sha256sum * > sha256sum.txt

          echo
          echo "========== RELEASE FILES =========="
          ls -lah

      # ==========================================================
      # Artifact
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-droidspaces-ksu
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "droidspaces-${{ github.run_number }}"
          name: "Redmi Note 7 Pro Droidspaces + KernelSU-Next ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true

          files: |
            ${{ runner.temp }}/release/violet-droidspaces-ksu.img
            ${{ runner.temp }}/release/Image.gz
            ${{ runner.temp }}/release/Image
            ${{ runner.temp }}/release/dtbo-stock.img
            ${{ runner.temp }}/release/recovery-stock.img
            ${{ runner.temp }}/release/super_empty-stock.img
            ${{ runner.temp }}/release/vbmeta-stock.img
            ${{ runner.temp }}/release/build-manifest.xml
            ${{ runner.temp }}/release/kernel.config
            ${{ runner.temp }}/release/build-info.txt
            ${{ runner.temp }}/release/sha256sum.txt
