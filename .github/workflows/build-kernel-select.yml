name: Build Redmi Note 7 Pro Kernel

on:
  push:
    branches:
      - main
      - master
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/sdmsteppe-perf_defconfig

  ROM_BUILD: "20260826"

  BOOT_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/boot.img"
  DTBO_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/dtbo.img"
  RECOVERY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/recovery.img"
  SUPER_EMPTY_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/super_empty.img"
  VBMETA_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/vbmeta.img"
  MANIFEST_URL: "https://mirrorbits.lineageos.org/full/violet/20260826/build-manifest.xml"

  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: "legacy"

  CLANG_VERSION: "clang-r596125"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel source
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. Install build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            python3 \
            unzip \
            zip \
            rsync \
            lz4 \
            cpio \
            device-tree-compiler

      # ============================================================
      # 3. Cache ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.ARCH }}-${{ hashFiles('**/Makefile', '**/Kconfig*', '**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ARCH }}-

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --max-size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ============================================================
      # 4. Cache Android clang
      # ============================================================

      - name: Restore Android clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-clang
          key: android-clang-${{ env.CLANG_VERSION }}-v1
          restore-keys: |
            android-clang-${{ env.CLANG_VERSION }}-

      # ============================================================
      # 5. Download clang only when cache misses
      # ============================================================

      - name: Download Android clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/android-clang"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            "$RUNNER_TEMP/android-clang"

          echo "clang downloaded."

      # ============================================================
      # 6. Locate clang
      # ============================================================

      - name: Locate clang
        run: |
          set -eux

          CLANG_BIN="$(find "$RUNNER_TEMP/android-clang" \
            -type f \
            -path '*/bin/clang' \
            | head -n1 \
            | xargs -r dirname)"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang not found"
            find "$RUNNER_TEMP/android-clang" -type f -name clang
            exit 1
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          "$CLANG_BIN/clang" --version

      # ============================================================
      # 7. Prepare LLVM environment
      # ============================================================

      - name: Configure LLVM
        run: |
          set -eux

          export PATH="$CLANG_BIN:$PATH"

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "READELF=llvm-readelf" >> "$GITHUB_ENV"
          echo "OBJSIZE=llvm-size" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"

          # Linux 4.14 + old Android kernel:
          # use LLVM compiler but disable integrated assembler.
          echo "LLVM_IAS=0" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 8. Create output directory
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          export OUT="$GITHUB_WORKSPACE/out"

          mkdir -p "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # ============================================================
      # 9. KernelSU-Next legacy
      #
      # IMPORTANT:
      # Do NOT clone KernelSU-Next into the kernel tree.
      # setup.sh itself clones/updates KernelSU-Next.
      #
      # We fetch the official setup script and run:
      #
      #     setup.sh legacy
      #
      # This is the official non-GKI integration method.
      # ============================================================

      - name: Integrate KernelSU-Next legacy
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o "$RUNNER_TEMP/ksu-setup.sh"

          chmod +x "$RUNNER_TEMP/ksu-setup.sh"

          bash "$RUNNER_TEMP/ksu-setup.sh" legacy

          echo
          echo "========================================"
          echo " KernelSU-Next integration"
          echo "========================================"

          test -e drivers/kernelsu

          ls -lah drivers/kernelsu

      # ============================================================
      # 10. Enable KernelSU + Droidspaces kernel configuration
      # ============================================================

      - name: Configure kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          ./scripts/config \
            --file "$OUT/.config" \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU \
            -e KSU_KPROBE_HOOKS

          # --------------------------------------------------------
          # Droidspaces
          # --------------------------------------------------------

          ./scripts/config \
            --file "$OUT/.config" \
            -e SYSCTL \
            -e SYSVIPC \
            -e POSIX_MQUEUE \
            -e NAMESPACES \
            -e PID_NS \
            -e UTS_NS \
            -e IPC_NS \
            -e NET_NS \
            -e USER_NS \
            -e SECCOMP \
            -e SECCOMP_FILTER \
            -e CGROUPS \
            -e CGROUP_DEVICE \
            -e CGROUP_PIDS \
            -e MEMCG \
            -e CGROUP_SCHED \
            -e FAIR_GROUP_SCHED \
            -e CGROUP_FREEZER \
            -e CGROUP_NET_PRIO \
            -e DEVTMPFS \
            -e OVERLAY_FS \
            -e TMPFS_POSIX_ACL \
            -e TMPFS_XATTR \
            -e FW_LOADER \
            -e FW_LOADER_USER_HELPER \
            -e VETH \
            -e BRIDGE \
            -e BRIDGE_NETFILTER \
            -e NETFILTER \
            -e NETFILTER_ADVANCED \
            -e NF_CONNTRACK \
            -e NF_CONNTRACK_IPV4 \
            -e NF_CONNTRACK_NETLINK \
            -e NF_NAT \
            -e NF_NAT_IPV4 \
            -e IP_NF_IPTABLES \
            -e IP_NF_FILTER \
            -e IP_NF_NAT \
            -e IP_NF_TARGET_MASQUERADE \
            -e NETFILTER_XT_TARGET_MASQUERADE \
            -e NETFILTER_XT_TARGET_TCPMSS \
            -e NETFILTER_XT_TARGET_REJECT \
            -e NETFILTER_XT_MATCH_ADDRTYPE \
            -e NETFILTER_XT_MATCH_CONNTRACK \
            -e NETFILTER_XT_MATCH_MULTIPORT \
            -e NETFILTER_XT_MATCH_RECENT \
            -e IP_SET \
            -e NETFILTER_XT_SET \
            -e NF_NAT_REDIRECT \
            -e IP_ADVANCED_ROUTER \
            -e IP_MULTIPLE_TABLES

          # --------------------------------------------------------
          # Let Kconfig resolve dependencies.
          # --------------------------------------------------------

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            olddefconfig

          echo
          echo "========================================"
          echo " KernelSU configuration"
          echo "========================================"

          grep '^CONFIG_KPROBES=' "$OUT/.config"
          grep '^CONFIG_KPROBE_EVENTS=' "$OUT/.config"
          grep '^CONFIG_KSU=' "$OUT/.config"
          grep '^CONFIG_KSU_KPROBE_HOOKS=' "$OUT/.config"

      # ============================================================
      # 11. Verify required configuration
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          REQUIRED_CONFIGS="
          KPROBES
          KPROBE_EVENTS
          KSU
          KSU_KPROBE_HOOKS
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          NET_NS
          USER_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          VETH
          BRIDGE
          BRIDGE_NETFILTER
          NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          NF_CONNTRACK_IPV4
          NF_CONNTRACK_NETLINK
          NF_NAT
          NF_NAT_IPV4
          IP_NF_IPTABLES
          IP_NF_FILTER
          IP_NF_NAT
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_TARGET_REJECT
          NETFILTER_XT_MATCH_ADDRTYPE
          NETFILTER_XT_MATCH_CONNTRACK
          NETFILTER_XT_MATCH_MULTIPORT
          NETFILTER_XT_MATCH_RECENT
          IP_SET
          NETFILTER_XT_SET
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^CONFIG_${CONFIG}=y" "$OUT/.config"; then
              echo "OK   CONFIG_${CONFIG}=y"
            else
              echo "MISS CONFIG_${CONFIG}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: Required configuration is missing."
            exit 1
          fi

      # ============================================================
      # 12. Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          export PATH="$CLANG_BIN:$PATH"

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=0 \
            CC="clang" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            READELF="llvm-readelf" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            Image.gz \
            dtbs \
            modules

          test -f "$OUT/arch/arm64/boot/Image.gz"

      # ============================================================
      # 13. Show build result
      # ============================================================

      - name: Show build result
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo " Kernel"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            kernelversion

          echo
          echo "========================================"
          echo " Image"
          echo "========================================"

          ls -lh \
            "$OUT/arch/arm64/boot/Image.gz"

          echo
          echo "========================================"
          echo " DTBs"
          echo "========================================"

          find "$OUT/arch/arm64/boot/dts" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec ls -lh {} \;

      # ============================================================
      # 14. Download original LineageOS boot.img
      # ============================================================

      - name: Download original boot image
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/images"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/boot-original.img" \
            "$BOOT_URL"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/dtbo.img" \
            "$DTBO_URL"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/recovery.img" \
            "$RECOVERY_URL"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/super_empty.img" \
            "$SUPER_EMPTY_URL"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/vbmeta.img" \
            "$VBMETA_URL"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            -o "$RUNNER_TEMP/images/build-manifest.xml" \
            "$MANIFEST_URL"

          ls -lh "$RUNNER_TEMP/images"

      # ============================================================
      # 15. Install Android image tools
      # ============================================================

      - name: Install Android image tools
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/android-tools"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/Android-Image-Kitchen.git \
            "$RUNNER_TEMP/android-tools/AIK"

          echo "AIK=$RUNNER_TEMP/android-tools/AIK" >> "$GITHUB_ENV"

      # ============================================================
      # 16. Extract boot.img
      # ============================================================

      - name: Extract boot image
        run: |
          set -eux

          cd "$AIK"

          chmod +x unpackimg.sh repackimg.sh

          rm -rf \
            split_img \
            ramdisk \
            boot.img \
            image-new.img

          cp \
            "$RUNNER_TEMP/images/boot-original.img" \
            ./boot.img

          ./unpackimg.sh \
            -i boot.img

          test -d ramdisk
          test -f split_img/boot.img-kernel

      # ============================================================
      # 17. Replace kernel
      # ============================================================

      - name: Replace boot kernel
        run: |
          set -eux

          cp \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$AIK/split_img/boot.img-kernel"

      # ============================================================
      # 18. Repack boot.img
      # ============================================================

      - name: Repack boot image
        run: |
          set -eux

          cd "$AIK"

          ./repackimg.sh

          test -f image-new.img

          cp \
            image-new.img \
            "$GITHUB_WORKSPACE/boot-kernelsu-droidspaces.img"

      # ============================================================
      # 19. Generate checksums
      # ============================================================

      - name: Generate checksums
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            boot-kernelsu-droidspaces.img \
            > boot-kernelsu-droidspaces.img.sha256

          cp \
            "$RUNNER_TEMP/images/dtbo.img" \
            dtbo-original.img

          cp \
            "$RUNNER_TEMP/images/vbmeta.img" \
            vbmeta-original.img

          cp \
            "$RUNNER_TEMP/images/recovery.img" \
            recovery-original.img

          cp \
            "$RUNNER_TEMP/images/super_empty.img" \
            super_empty-original.img

          cp \
            "$RUNNER_TEMP/images/build-manifest.xml" \
            build-manifest.xml

          sha256sum \
            dtbo-original.img \
            vbmeta-original.img \
            recovery-original.img \
            super_empty-original.img \
            build-manifest.xml \
            > original-images.sha256

      # ============================================================
      # 20. Package build information
      # ============================================================

      - name: Create release information
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          KERNEL_VERSION="$(
            make \
              O="$OUT" \
              ARCH="$ARCH" \
              kernelversion
          )"

          cat > RELEASE.txt <<EOF
          Redmi Note 7 Pro (violet)

          ROM:
          LineageOS 23.2
          Build: ${ROM_BUILD}

          Kernel:
          ${KERNEL_VERSION}

          KernelSU:
          KernelSU-Next legacy

          Droidspaces:
          Enabled

          Architecture:
          arm64

          Build commit:
          ${GITHUB_SHA}

          Main file:
          boot-kernelsu-droidspaces.img

          IMPORTANT:
          This boot image is intended for the matching
          LineageOS ${ROM_BUILD} build.
          EOF

          cat RELEASE.txt

      # ============================================================
      # 21. Upload artifact
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernelsu-droidspaces-${{ env.ROM_BUILD }}
          path: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            dtbo-original.img
            vbmeta-original.img
            recovery-original.img
            super_empty-original.img
            build-manifest.xml
            original-images.sha256
            RELEASE.txt
          retention-days: 30

      # ============================================================
      # 22. Create GitHub Release
      #
      # Every commit automatically creates/updates a release.
      # No second compilation.
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.ROM_BUILD }}-${{ github.sha }}"
          name: "Redmi Note 7 Pro KernelSU + Droidspaces ${{ env.ROM_BUILD }}"
          body_path: RELEASE.txt
          files: |
            boot-kernelsu-droidspaces.img
            boot-kernelsu-droidspaces.img.sha256
            dtbo-original.img
            vbmeta-original.img
            recovery-original.img
            super_empty-original.img
            build-manifest.xml
            original-images.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
